<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Obras Elite</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f6f8;color:#172033}header{background:#172033;color:#fff;padding:16px}header h1{margin:0;font-size:23px}.wrap{max-width:1000px;margin:auto;padding:12px}.panel{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #0001}.hidden{display:none!important}input,button{font:inherit}input{width:100%;padding:12px;margin:5px 0;border:1px solid #ccd3dd;border-radius:10px}button{border:0;border-radius:11px;padding:11px;font-weight:700}.dark{background:#172033;color:#fff}.light{background:#e8ebef;color:#172033}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.nav button{background:#fff;border:1px solid #dde2e8}.nav .on{background:#172033;color:#fff}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.small{font-size:12px;color:#687386}.status{font-size:12px;margin-top:7px}.err{color:#b42318}.ok{color:#067647}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.work{background:#fff;border:1px solid #e1e5ea;border-radius:13px;padding:10px;min-height:126px}.work h3{font-size:14px;margin:0 0 7px}.bar{height:7px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#172033}.task{display:flex;justify-content:space-between;gap:8px;padding:11px 2px;border-bottom:1px solid #eee;color:inherit;text-decoration:none}.task b{font-size:13px}.due{font-size:11px;color:#667085;white-space:nowrap}.switch{display:flex;gap:6px}.switch button{padding:8px 12px}.calhead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#667085}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.day{background:#fff;border:1px solid #e1e5ea;border-radius:8px;min-height:74px;padding:4px;font-size:10px;overflow:hidden}.day.today{border:2px solid #172033}.event{display:block;background:#eef1f5;border-radius:4px;padding:2px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.week{display:grid;gap:7px}.wday{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:11px}.wday h3{margin:0 0 7px;font-size:14px}.wevent{display:block;text-decoration:none;color:inherit;background:#f5f6f8;border-radius:8px;padding:9px;margin-top:6px}.wevent b{font-size:13px}.range{width:100%;margin:14px 0}.back{margin-bottom:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.day{min-height:110px}.event{font-size:10px}}
</style></head><body><header><h1>App Obras Elite</h1></header><div class="wrap"><section id="login" class="panel"><h2>Acceso</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="enter" class="dark" style="width:100%">Entrar</button><div id="loginStatus" class="status"></div></section><section id="app" class="hidden"><div class="nav"><button data-mode="tasks">Tareas</button><button data-mode="calendar">Calendario</button><button data-mode="works" class="on">Obras</button></div><div class="panel"><div class="top"><b id="title">Obras</b><button id="refresh" class="light">Actualizar</button></div><div id="sync" class="status"></div></div><div id="content"></div><button id="logout" class="light" style="width:100%">Cerrar sesión</button></section></div><script>
const BASE='https://vyswxgbbqyffnduhhrvz.supabase.co',KEY='sb_publishable_nzhp4ZiQ5NltXfmuoBc-hg_v_OVHRYb',FN=BASE+'/functions/v1/trello-obras';const $=id=>document.getElementById(id);let session=JSON.parse(localStorage.getItem('elite_session')||'null'),DATA=[],mode='works',calMode='month',calCursor=new Date();const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const fd=x=>x?new Date(x).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
function isChecklistCard(c){return /^\s*\d+\s*\.\s+/.test(c.name||'') || /^\s*\d{2}\s*·\s+/.test(c.name||'')}
function mainCards(b){return (b.cards||[]).filter(c=>!c.closed&&!isChecklistCard(c))}
function checklistCards(b){return (b.cards||[]).filter(c=>!c.closed&&isChecklistCard(c))}
function allCards(){return DATA.flatMap(b=>(b.cards||[]).map(c=>({...c,board:b}))).filter(c=>!c.closed&&!isChecklistCard(c))}function pending(){return allCards().filter(c=>!c.dueComplete&&!c.complete)}function progress(b){let c=mainCards(b);return c.length?Math.round(c.filter(x=>x.dueComplete||x.complete).length*100/c.length):0}function cardDue(c){return c.due?.date||c.due||null}function cardStart(c){return c.start||c.startedAt||null}
async function login(){try{let r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.message);session=d;localStorage.setItem('elite_session',JSON.stringify(d));show();load()}catch(e){$('loginStatus').textContent='Error: '+e.message}}
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function load(){$('sync').textContent='Actualizando…';try{let r=await fetch(FN,{headers:{Authorization:'Bearer '+session.access_token,apikey:KEY}}),d=await r.json();if(!r.ok)throw Error(d.error||'Error '+r.status);DATA=Array.isArray(d)?d:(d.boards||[]);$('sync').textContent='Actualizado desde Trello';$('sync').className='status ok';render()}catch(e){$('sync').textContent='Error al leer Trello: '+e.message;$('sync').className='status err'}}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));if(mode==='works')works();else if(mode==='tasks')tasks(false);else calendar()}
function workDate(id,kind){return localStorage.getItem('elite_work_'+kind+'_'+id)||''}
function saveWorkDate(id,kind,value){if(value)localStorage.setItem('elite_work_'+kind+'_'+id,value);else localStorage.removeItem('elite_work_'+kind+'_'+id);works()}
function workDateLabel(value){if(!value)return '—';let a=value.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:'—'}
function works(){$('title').textContent='Obras';$('content').innerHTML='<div class="grid">'+DATA.map((b,i)=>{let cs=mainCards(b),pd=cs.filter(c=>!c.dueComplete&&!c.complete).length,st=cs.map(cardStart).filter(Boolean).sort(),du=cs.map(cardDue).filter(Boolean).sort(),p=localStorage.getItem('progress_'+b.id)??progress(b);return `<div class="work" onclick="detail(${i})"><h3>${esc(b.name)}</h3><div class="small">Inicio: ${workDateLabel(workDate(b.id,'start'))}<br>Fin: ${workDateLabel(workDate(b.id,'end'))}<br>Pendientes: <b>${pd}</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="small">${p}% avance</div></div>`}).join('')+'</div>'}
function tasks(noDate=false){$('title').textContent=noDate?'Tareas sin fecha':'Tareas pendientes';let cs=pending().filter(c=>noDate?!cardDue(c):!!cardDue(c)).sort((a,b)=>new Date(cardDue(a))-new Date(cardDue(b)));$('content').innerHTML=`<div class="panel"><button class="light" onclick="tasks(${!noDate})">${noDate?'Ver tareas con fecha':'Tareas sin fecha'}</button>${cs.map(c=>`<a class="task" href="${esc(c.url)}" target="_blank"><b>${esc(c.name)}</b><span class="due">${fd(cardDue(c))}</span></a>`).join('')||'<p>Sin tareas.</p>'}</div>`}
function calNav(n){if(calMode==='month')calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);else calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth(),calCursor.getDate()+7*n);calendar()}function setCal(v){calMode=v;calendar()}
function calendar(){$('title').textContent='Calendario';let cs=pending().filter(c=>cardDue(c));let controls=`<div class="panel"><div class="top"><div class="switch"><button class="${calMode==='month'?'dark':'light'}" onclick="setCal('month')">Mes</button><button class="${calMode==='week'?'dark':'light'}" onclick="setCal('week')">Semana</button></div><div class="switch"><button class="light" onclick="calNav(-1)">‹</button><button class="light" onclick="calCursor=new Date();calendar()">Hoy</button><button class="light" onclick="calNav(1)">›</button></div></div></div>`;$('content').innerHTML=controls+(calMode==='month'?monthView(cs):weekView(cs))}
function monthView(cs){let y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),map={};cs.forEach(c=>{let d=new Date(cardDue(c));if(d.getFullYear()===y&&d.getMonth()===m)(map[d.getDate()]??=[]).push(c)});let h=`<div class="panel"><h3>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h3><div class="calhead">${['L','M','X','J','V','S','D'].map(x=>'<b>'+x+'</b>').join('')}</div><div class="month">`;let off=(first.getDay()+6)%7;for(let i=0;i<off;i++)h+='<div></div>';let now=new Date();for(let d=1;d<=last.getDate();d++){let today=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d;h+=`<div class="day ${today?'today':''}"><b>${d}</b>${(map[d]||[]).map(c=>`<span class="event" title="${esc(c.name)}">${esc(c.name)}</span>`).join('')}</div>`}return h+'</div></div>'}
function weekView(cs){let d=new Date(calCursor),day=(d.getDay()+6)%7,start=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);let days=Array.from({length:7},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));let h=`<div class="panel"><h3>${fd(days[0])} — ${fd(days[6])}</h3><div class="week">`;for(const x of days){let ev=cs.filter(c=>{let q=new Date(cardDue(c));return q.toDateString()===x.toDateString()});h+=`<div class="wday"><h3>${x.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}</h3>${ev.map(c=>`<a class="wevent" href="${esc(c.url)}" target="_blank"><b>${esc(c.name)}</b><div class="small">${esc(c.board.name)} · ${new Date(cardDue(c)).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div></a>`).join('')||'<span class="small">Sin tareas</span>'}</div>`}return h+'</div></div>'}
function detail(i){let b=DATA[i],cs=mainCards(b),check=checklistCards(b),p=localStorage.getItem('progress_'+b.id)??progress(b);$('title').textContent=b.name;$('content').innerHTML=`<div class="panel"><button class="light back" onclick="works()">← Obras</button><h2>${esc(b.name)}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0"><label style="font-size:13px;font-weight:700">Inicio de obra<input aria-label="Fecha inicio de obra" type="date" value="${workDate(b.id,'start')}" onchange="saveWorkDate('${b.id}','start',this.value);detail(${i})" style="width:100%;padding:9px;margin-top:5px;border:1px solid #ccd4dd;border-radius:9px"></label><label style="font-size:13px;font-weight:700">Fin de obra<input aria-label="Fecha fin de obra" type="date" value="${workDate(b.id,'end')}" onchange="saveWorkDate('${b.id}','end',this.value);detail(${i})" style="width:100%;padding:9px;margin-top:5px;border:1px solid #ccd4dd;border-radius:9px"></label></div><p class="small">Las fechas se guardan en este dispositivo, no en Trello.</p><b>Avance: <span id="pv">${p}</span>%</b><input class="range" type="range" min="0" max="100" value="${p}" oninput="document.getElementById('pv').textContent=this.value;localStorage.setItem('progress_${b.id}',this.value)"><details style="margin:16px 0;border:1px solid #dce2e9;border-radius:12px;padding:12px"><summary style="font-weight:750;cursor:pointer">☑ Checklist (${check.length})</summary><div style="padding-top:10px">${check.map(c=>`<a class="task" href="${esc(c.url)}" target="_blank"><span>☐ ${esc(c.name)}</span></a>`).join('')||'<p class="small">Sin elementos de checklist.</p>'}</div></details><h3>Tareas</h3>${cs.map(c=>`<a class="task" href="${esc(c.url)}" target="_blank"><b>${esc(c.name)}</b><span class="due">${fd(cardDue(c))}</span></a>`).join('')}</div>`}
$('enter').onclick=login;$('refresh').onclick=load;$('logout').onclick=()=>{localStorage.removeItem('elite_session');location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});if(session?.access_token){show();load()}
</script></body></html>
