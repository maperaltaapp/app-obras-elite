<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Obras Elite</title>
<style>
body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:20px 30px}
main{max-width:850px;margin:auto;padding:30px}.card{background:#fff;padding:30px;border-radius:24px;margin-bottom:16px}
input,button{box-sizing:border-box;width:100%;padding:16px;margin-top:14px;border-radius:12px;font-size:18px}
input{border:1px solid #aaa}button{border:0;background:#111827;color:#fff;font-weight:700}.secondary{background:#e5e7eb;color:#111827}
.hidden{display:none}.status{white-space:pre-wrap;word-break:break-word;margin-top:14px}.err{color:#b91c1c}.ok{color:#047857}

.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between}.toolbar h2{margin:0}.toolbar button{width:auto;margin:0;padding:11px 14px}
.summary{color:#64748b;margin:8px 0 18px}.tasklist{display:grid;gap:10px}.task{display:block;text-decoration:none;color:#111827;border:1px solid #e5e7eb;border-radius:16px;padding:16px;background:#fff}
.task-title{font-weight:750;font-size:17px;line-height:1.3}.task-meta{font-size:13px;color:#64748b;margin-top:7px}
.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.empty{padding:22px 0;color:#64748b;text-align:center}
@media(min-width:700px){.tasklist{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>App Obras Elite</h1><p>Trello · Supabase · Gestión de obras</p></header><main>
<section id="login" class="card"><h2>Acceso</h2>
<input id="email" type="email" autocomplete="email" placeholder="Correo electrónico">
<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
<button id="enter" type="button">Entrar</button><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden"><div class="card"><div id="user"></div>
<button id="refresh" type="button">Actualizar desde Trello</button><button id="logout" type="button" class="secondary">Cerrar sesión</button>
<div id="sync" class="status"></div></div><div class="card"><div class="toolbar"><h2>Obra</h2><span id="count" class="badge">0 tareas</span></div>
<div id="summary" class="summary">Cargando información…</div><div id="content" class="tasklist"></div></div></section>
</main>
<script>
const BUILD="DIAGNOSTICO-2026-10-09-02";
const SB_URL="https://vyswxgbbqyffnduhhrvz.supabase.co";
const SB_KEY="sb_publishable_nzhp4ZiQ5NltXfmuoBc-hg_v_OVHRYb";
const FN=SB_URL+"/functions/v1/trello-obras";
const $=id=>document.getElementById(id);
function status(id,text,ok=false){const n=$(id);n.textContent=text;n.className="status "+(ok?"ok":"err");}
async function api(path,options={}){
 const r=await fetch(SB_URL+path,{...options,headers:{apikey:SB_KEY,...(options.headers||{})}});
 const text=await r.text(); let data={}; try{data=text?JSON.parse(text):{}}catch{data={raw:text}}
 if(!r.ok) throw new Error(data.msg||data.message||data.error_description||data.error||("HTTP "+r.status));
 return data;
}
function getSession(){try{return JSON.parse(localStorage.getItem("elite_session")||"null")}catch{return null}}
function saveSession(s){localStorage.setItem("elite_session",JSON.stringify(s))}
function clearSession(){localStorage.removeItem("elite_session")}
function show(){
 const s=getSession(), logged=!!s?.access_token;
 $("login").classList.toggle("hidden",logged); $("app").classList.toggle("hidden",!logged);
 if(logged)$("user").textContent="Sesión: "+(s.user?.email||"usuario");
}
$("enter").addEventListener("click",async()=>{
 const email=$("email").value.trim(), password=$("password").value;
 if(!email||!password){status("loginMsg","Escribe correo y contraseña.");return}
 status("loginMsg","Conectando a "+SB_URL+" · "+BUILD,true); $("enter").disabled=true;
 try{
  const data=await api("/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  saveSession(data); status("loginMsg","Acceso correcto.",true); show(); await load();
 }catch(e){
  let info="Error de acceso: "+e.message+" · "+BUILD;
  if(e instanceof TypeError){
    try {const test=await fetch(SB_URL+"/auth/v1/settings",{cache:"no-store"}); info+=" · Prueba conexión HTTP "+test.status;}
    catch(t){info+=" · Prueba conexión: "+t.message;}
    info+=" · Origen: "+location.origin;
  }
  status("loginMsg",info);
 }
 finally{$("enter").disabled=false}
});
$("logout").addEventListener("click",()=>{clearSession();show()});
$("refresh").addEventListener("click",load);
async function load(){
 const s=getSession(); if(!s?.access_token)return;
 status("sync","Actualizando desde Trello…",true);
 try{
  const r=await fetch(FN,{headers:{Authorization:"Bearer "+s.access_token,apikey:SB_KEY}});
  const text=await r.text(); if(!r.ok)throw new Error("HTTP "+r.status+": "+text);
  let d;try{d=JSON.parse(text)}catch{d=text}
  const cards=Array.isArray(d)?d:(Array.isArray(d?.cards)?d.cards:[]);
  const active=cards.filter(c=>!c.closed);
  $("count").textContent=active.length+" "+(active.length===1?"tarea":"tareas");
  $("summary").textContent=active.length?"Pulsa una tarea para abrirla directamente en Trello.":"No hay tareas activas para mostrar.";
  const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("content").innerHTML=active.length?active.map((c,i)=>`<a class="task" href="${esc(c.url||"#")}" target="_blank" rel="noopener"><div class="task-title">${esc(c.name||"Sin título")}</div><div class="task-meta">Tarea ${i+1} · Abrir en Trello ›</div></a>`).join(""):'<div class="empty">Sin tareas activas.</div>';
  status("sync","Datos actualizados desde Trello.",true);
 }catch(e){status("sync","Login correcto. Error al leer Trello: "+e.message)}
}
show();
</script></body></html>
