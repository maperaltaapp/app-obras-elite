function taskDayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function taskUrgency(c){const d=validTaskDate(c);if(!d||taskDone(c))return '';const day=taskDayKey(d),today=taskDayKey(new Date());return day<today?'overdue':day===today?'today':''}
function groupedTaskList(cards){return taskBoards().map(b=>{const own=cards.filter(c=>c.board.id===b.id);if(!own.length)return '';const stages=new Map();own.forEach(c=>{const key=c.idList||'';if(!stages.has(key))stages.set(key,[]);stages.get(key).push(c)});return `<details class="task-group"><summary>${esc(b.name)}<span class="count">${own.length}</span></summary>${Array.from(stages,([id,cs])=>{const name=(b.lists||[]).find(l=>l.id===id)?.name||'Tareas';return `<details class="stage-group"${cs.length<=4?' open':''}><summary>${esc(name)} · ${cs.length}</summary>${cs.map(c=>compactTask(c,b,false)).join('')}</details>`}).join('')}</details>`}).join('')}

function monthView(cs){const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),map={};cs.slice().sort((a,b)=>validTaskDate(a)-validTaskDate(b)).forEach(c=>{const d=validTaskDate(c);if(d&&d.getFullYear()===y&&d.getMonth()===m)(map[d.getDate()]??=[]).push(c)});let html=`<div class="panel calendar-panel"><div class="calendar-caption"><h3>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h3><span>${cs.filter(c=>{const d=validTaskDate(c);return d&&d.getMonth()===m&&d.getFullYear()===y}).length} tareas</span></div><div class="calhead">${['L','M','X','J','V','S','D'].map(x=>'<b>'+x+'</b>').join('')}</div><div class="month">`;const offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++)html+='<div class="empty-day" aria-hidden="true"></div>';const now=taskDayKey(new Date());for(let day=1;day<=last.getDate();day++){const d=new Date(y,m,day),hol=holidayFor(d),today=taskDayKey(d)===now,events=map[day]||[],milestones=workMilestones(d);html+=`<div class="day ${today?'today':''} ${hol?'holiday':''}"><div class="day-number"><b>${day}</b>${hol?`<span class="holiday-dot" title="${esc(hol.name)}" aria-label="${esc(hol.name)}">•</span>`:''}</div>${events.slice(0,2).map(calendarTask).join('')}${calendarOverflow(events,2,true)}${milestones.length?`<details class="milestone-more"><summary>${milestones.length} hito${milestones.length>1?'s':''}</summary><div class="day-menu">${milestoneTags(d)}</div></details>`:''}</div>`}return html+'</div><div class="calendar-key"><span><i class="key-dot teal"></i>Obras</span><span><i class="key-dot purple"></i>Personal</span><span><i class="key-dot amber"></i>Trabajo</span><span><i class="key-dot red"></i>Festivo / hito</span></div></div>'}

async function recoverLocalDates(id){const w=NATIVE_WORKS.find(w=>w.id===id),data={};for(const [kind,col] of [['start','start_date'],['end','end_date']]){const v=localStorage.getItem('elite_work_'+kind+'_'+w.trello_id);if(v&&!w[col])data[col]=v}const p=localStorage.getItem('progress_'+w.trello_id);if(p!==null&&w.progress===null)data.progress=Number(p);if(!Object.keys(data).length){statusMessage('No hay fechas antiguas pendientes en este dispositivo.');return}try{await eliteRequest('/rest/v1/elite_works?id=eq.'+id,{method:'PATCH',body:JSON.stringify(data)});await load();detail(id);statusMessage('Fechas recuperadas y guardadas en tu cuenta.')}catch(e){statusMessage(e.message,true)}}
function taskMatches(c,q){return (!q||[c.name,c.description,c.board.name,c.stage,...(c.labels||[]).map(l=>typeof l==='string'?l:l.name||l.color)].join(' ').toLocaleLowerCase('es').includes(q))&&(taskPriority==='all'||c.priority===taskPriority)&&(taskState==='all'||c.status===taskState)&&(taskWork==='all'||c.board.id===taskWork)}
function renderTaskResults(){const q=taskQuery.trim().toLocaleLowerCase('es');const cards=taskBoards().flatMap(b=>b.cards.map(c=>({...c,board:b}))).filter(c=>(taskFilter==='archived'?c.closed:!c.closed)&&(taskSource==='all'||taskSource===c.category)&&(taskFilter==='archived'||(taskFilter==='done'?taskDone(c):!taskDone(c)&&(taskFilter==='dated'?!!validTaskDate(c):taskFilter==='undated'?!validTaskDate(c):true)))&&taskMatches(c,q));const dated=cards.filter(validTaskDate),undated=cards.filter(c=>!validTaskDate(c));$('taskResults').innerHTML=`<div class="task-summary">${cards.length} tareas · Toca para editar</div>`+(cards.length?(taskFilter==='undated'||taskFilter==='done'||taskFilter==='archived'?groupedTaskList(cards):datedTaskList(dated)+(undated.length?'<h3 class="agenda-heading">Sin fecha</h3>'+groupedTaskList(undated):'')):'<div class="empty-tasks">No hay tareas en esta vista.</div>')}
function tasks(filter=taskFilter){taskFilter=filter;$('title').textContent=filter==='dated'?'Tareas con fecha':'Tareas';$('content').innerHTML='<div class="task-toolbar">'+[['dated','Con fecha'],['pending','Pendientes'],['undated','Sin fecha'],['done','Finalizadas'],['archived','Archivo']].map(([v,l])=>`<button class="${v===filter?'dark':'light'}" onclick="tasks('${v}')">${l}</button>`).join('')+`</div><div class="task-search-row"><input id="taskSearch" class="task-search" type="search" placeholder="Buscar tarea, obra o etiqueta…" aria-label="Buscar tarea, obra o etiqueta" value="${esc(taskQuery)}"><select id="taskSource" class="task-source" aria-label="Tipo de tareas">${fieldOptions({all:'Todas',personal:'Personales',work:'Trabajo'},taskSource)}</select></div><details class="filter-details"><summary>Filtros${taskPriority!=='all'||taskState!=='all'||taskWork!=='all'?' · activos':''}</summary><div class="task-toolbar"><select id="filterPriority" aria-label="Prioridad">${fieldOptions({all:'Todas las prioridades',...PRIORITY_NAMES},taskPriority)}</select><select id="filterState" aria-label="Estado">${fieldOptions({all:'Todos los estados',...STATUS_NAMES},taskState)}</select><select id="filterWork" aria-label="Obra">${fieldOptions({all:'Todas las obras',...Object.fromEntries(taskBoards().map(b=>[b.id,b.name]))},taskWork)}</select></div></details><div id="taskResults"></div>`;$('taskSearch').oninput=e=>{taskQuery=e.target.value;renderTaskResults()};$('taskSource').onchange=e=>{taskSource=e.target.value;renderTaskResults()};$('filterPriority').onchange=e=>{taskPriority=e.target.value;renderTaskResults()};$('filterState').onchange=e=>{taskState=e.target.value;renderTaskResults()};$('filterWork').onchange=e=>{taskWork=e.target.value;renderTaskResults()};renderTaskResults()}
function openTaskForm(id=null,workId=null){editingTask=id?OWN_TASKS.find(t=>t.id===id):null;if(id&&!editingTask)return;const t=editingTask||{title:'',category:'work',work_id:workId,description:'',status:'pending',priority:'normal',stage:'General',recurrence:'none',remind_minutes:null};editorChecks=JSON.parse(JSON.stringify(t.checklists||[]));dialogForm(`<form id="ownTaskForm"><div class="top"><h2>${id?'Editar tarea':'Nueva tarea'}</h2><button id="closeTask" type="button" class="light" aria-label="Cerrar">✕</button></div><label>Nombre<input id="ownTitle" required maxlength="240" value="${esc(t.title)}"></label><div class="form-pair"><label>Tipo<select id="ownCategory">${fieldOptions({work:'Trabajo',personal:'Personal'},t.category)}</select></label><label>Obra<select id="ownWorkId"><option value="">Sin obra</option>${NATIVE_WORKS.filter(w=>!w.archived_at||w.id===t.work_id).map(w=>`<option value="${w.id}" ${w.id===t.work_id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label></div><div class="form-pair"><label>Estado<select id="ownState">${fieldOptions(STATUS_NAMES,t.status)}</select></label><label>Prioridad<select id="ownPriority">${fieldOptions(PRIORITY_NAMES,t.priority)}</select></label></div><div class="form-pair"><label>Inicio<input id="ownStart" type="datetime-local" value="${localDateTime(t.start_at)}"></label><label>Vencimiento<input id="ownDue" type="datetime-local" value="${localDateTime(t.due_at)}"></label></div><label>Notas<textarea id="ownDescription" maxlength="50000">${esc(t.description)}</textarea></label><details ${editorChecks.length?'open':''}><summary>Checklists <span id="checkSummary"></span></summary><div id="checkEditor"></div><button type="button" class="light" id="addChecklist">+ Checklist</button></details><details class="extra-options"><summary>Etapa, etiquetas y repetición</summary><label>Etapa<input id="ownStage" list="stages" maxlength="160" value="${esc(t.stage)}"><datalist id="stages"></datalist></label><label>Etiquetas · separadas por comas<input id="ownLabels" value="${esc((t.labels||[]).map(l=>typeof l==='string'?l:l.name||l.color).join(', '))}"></label><label>Repetición<select id="ownRecurrence">${fieldOptions({none:'No repetir',daily:'Diaria',weekly:'Semanal',monthly:'Mensual'},t.recurrence)}</select></label><p class="small">Al completar, se crea la siguiente tarea con sus casillas sin marcar. Las fechas mantienen la hora de Madrid.</p><label>Recordatorio<select id="ownReminder">${fieldOptions({'':'Sin aviso','0':'A la hora','15':'15 minutos antes','60':'1 hora antes','1440':'1 día antes','5':'5 minutos antes','30':'30 minutos antes'},String(t.remind_minutes??''))}</select></label><p class="small">Las notificaciones de Elite están pendientes de activación. Puedes pedir recordatorios por separado en ChatGPT.</p></details><div id="ownFormStatus" class="status err" role="status"></div><div class="form-actions"><button class="dark" type="submit">Guardar</button>${id?`<button class="light" type="button" id="completeOwn">${t.completed?'Reabrir':'Completar'}</button><button class="light" type="button" id="archiveOwn">${t.deleted_at?'Restaurar':'Archivar'}</button><button class="light" type="button" id="historyOwn">Historial</button>`:''}</div></form>`);$('ownTaskForm').onsubmit=saveOwnTask;$('addChecklist').onclick=()=>{editorChecks.push({id:crypto.randomUUID(),name:'Checklist',items:[]});renderCheckEditor()};$('ownWorkId').onchange=()=>updateStageOptions();$('ownCategory').onchange=()=>{if($('ownCategory').value==='personal')$('ownWorkId').value='';updateStageOptions()};updateStageOptions();renderCheckEditor();if(id){$('completeOwn').onclick=()=>completeNativeTask(t);$('archiveOwn').onclick=()=>changeOwnTask({deleted_at:t.deleted_at?null:new Date().toISOString()});$('historyOwn').onclick=()=>showHistory(t.id)}$('ownTitle').focus()}
function updateStageOptions(){if($('ownWorkId').value)$('ownCategory').value='work';const w=NATIVE_WORKS.find(w=>w.id===$('ownWorkId').value);$('stages').innerHTML=(w?.stages||[]).map(s=>`<option value="${esc(s)}"></option>`).join('')}
function renderCheckEditor(){let total=0,done=0;editorChecks.forEach(c=>c.items.forEach(i=>{total++;if(i.done)done++}));$('checkSummary').textContent=total?done+'/'+total:'';$('checkEditor').innerHTML=editorChecks.map((c,ci)=>`<section class="check-group"><input aria-label="Nombre de checklist ${ci+1}" maxlength="160" value="${esc(c.name)}" oninput="editorChecks[${ci}].name=this.value"><div>${c.items.map((i,ii)=>`<div class="check-row"><input type="checkbox" aria-label="Completar ${esc(i.text)}" ${i.done?'checked':''} onchange="editorChecks[${ci}].items[${ii}].done=this.checked;refreshCheckSummary()"><input class="check-text" aria-label="Texto del elemento ${ii+1}" maxlength="1000" value="${esc(i.text)}" oninput="editorChecks[${ci}].items[${ii}].text=this.value"></div>`).join('')}</div><button class="light" type="button" onclick="editorChecks[${ci}].items.push({id:crypto.randomUUID(),text:'',done:false});renderCheckEditor()">+ Elemento</button></section>`).join('')}
function refreshCheckSummary(){const items=editorChecks.flatMap(c=>c.items);$('checkSummary').textContent=items.filter(i=>i.done).length+'/'+items.length}
function collectNativeTask(){const due=$('ownDue').value,start=$('ownStart').value,repeat=$('ownRecurrence').value;if(start&&due&&new Date(start)>new Date(due))throw Error('El vencimiento debe ser posterior al inicio.');if(repeat!=='none'&&!due)throw Error('Indica un vencimiento para repetir la tarea.');const labels=$('ownLabels').value.split(',').map(x=>x.trim()).filter(Boolean);if(labels.length>50)throw Error('Máximo 50 etiquetas.');const wid=$('ownWorkId').value||null;return {title:$('ownTitle').value.trim(),category:wid?'work':$('ownCategory').value,work_id:wid,work_name:wid?NATIVE_WORKS.find(w=>w.id===wid)?.name||'':editingTask?.work_name||'',description:$('ownDescription').value,start_at:start?new Date(start).toISOString():null,due_at:due?new Date(due).toISOString():null,status:$('ownState').value,completed:$('ownState').value==='done',priority:$('ownPriority').value,labels,stage:$('ownStage').value.trim()||'General',recurrence:repeat,recurrence_timezone:'Europe/Madrid',remind_minutes:due&&$('ownReminder').value!==''?Number($('ownReminder').value):null,checklists:editorChecks.map(c=>({...c,name:c.name.trim()||'Checklist',items:c.items.filter(i=>i.text.trim()).map(i=>({...i,text:i.text.trim()}))}))}}
async function patchNativeTask(t,data){const rows=await eliteRequest('/rest/v1/elite_tasks?id=eq.'+t.id+'&updated_at=eq.'+encodeURIComponent(t.updated_at),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(data)});if(!rows?.length)throw Error('Esta tarea ha cambiado en otro dispositivo. Cierra, actualiza y vuelve a intentarlo.');return rows[0]}
async function saveOwnTask(e){e.preventDefault();lockOwnForm(true);try{const data=collectNativeTask();if(!data.title)throw Error('Escribe el nombre.');const shouldComplete=data.completed&&(!editingTask||!editingTask.completed)&&data.recurrence!=='none';if(shouldComplete){data.completed=false;data.status='pending'}let saved;if(editingTask)saved=await patchNativeTask(editingTask,data);else saved=(await eliteRequest('/rest/v1/elite_tasks',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(data)}))[0];editingTask=saved;if(shouldComplete)await eliteRequest('/rest/v1/rpc/elite_complete_task',{method:'POST',body:JSON.stringify({task_id:saved.id,expected_updated_at:saved.updated_at})});await fetchOwnTasks();closeTaskDialog();render();statusMessage('Tarea guardada.')}catch(err){$('ownFormStatus').textContent=err.message;lockOwnForm(false)}}
async function completeNativeTask(t){lockOwnForm(true);try{if(t.completed)await patchNativeTask(t,{completed:false,status:'pending'});else{const data=collectNativeTask();data.completed=false;data.status=t.status==='done'?'pending':t.status;const saved=await patchNativeTask(t,data);await eliteRequest('/rest/v1/rpc/elite_complete_task',{method:'POST',body:JSON.stringify({task_id:saved.id,expected_updated_at:saved.updated_at})})}await fetchOwnTasks();closeTaskDialog();render();statusMessage(t.completed?'Tarea reabierta.':'Tarea completada.')}catch(e){$('ownFormStatus').textContent=e.message;lockOwnForm(false)}}
async function changeOwnTask(data){lockOwnForm(true);try{await patchNativeTask(editingTask,data);await fetchOwnTasks();closeTaskDialog();render();statusMessage(data.deleted_at?'Tarea archivada. Puedes restaurarla desde Archivo.':'Tarea restaurada.')}catch(e){$('ownFormStatus').textContent=e.message;lockOwnForm(false)}}
async function showHistory(id){try{const rows=await eliteRequest('/rest/v1/elite_history?select=*&entity_id=eq.'+id+'&order=created_at.desc&limit=100');dialogForm(`<div class="top"><h2>Historial</h2><button id="closeTask" class="light">✕</button></div><p class="small">Últimos 100 cambios guardados en Elite.</p>${rows.map(r=>`<div class="history-row"><b>${esc(r.action)}</b> · ${esc(new Date(r.created_at).toLocaleString('es-ES'))}<div class="small">${esc(r.title)}</div><div class="small">${esc((r.fields||[]).map(f=>FIELD_NAMES[f]||f).join(' · '))}</div></div>`).join('')||'<p class="small">Sin cambios registrados.</p>'}`)}catch(e){statusMessage(e.message,true)}}
// Push remains explicitly paused until the owner approves and validates its configuration.
function showNotificationSettings(){dialogForm('<div class="top"><h2>Recordatorios</h2><button id="closeTask" class="light">✕</button></div><p>Los avisos de Elite con la app cerrada están pendientes de activación.</p><p class="small">Puedes guardar fechas y recordatorios aquí, pero todavía no se enviarán notificaciones. Los recordatorios que pidas y confirmes en ChatGPT son independientes.</p>')}
function compactTask(c,b,showBoard=true){const d=validTaskDate(c),label=d?fd(d):'Sin fecha',time=d?d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'';const items=(c.checklists||[]).flatMap(cl=>cl.items||[]);const meta=[showBoard?b.name:'',c.status&&c.status!=='pending'?STATUS_NAMES[c.status]:'',c.priority&&c.priority!=='normal'?PRIORITY_NAMES[c.priority]:'',items.length?'☑ '+items.filter(i=>i.done).length+'/'+items.length:''].filter(Boolean).join(' · ');return `<button class="compact-task own-task ${taskUrgency(c)} ${taskTone(c)}" onclick="openTaskForm('${c.id}')" title="${esc(c.name+' · '+b.name)}" aria-label="${esc(c.name+' · '+b.name+' · '+label)}"><span class="task-copy"><span class="task-name">${taskDone(c)?'✓ ':''}${esc(shortTaskName(c.name))}</span>${meta?`<span class="task-board">${esc(meta)}</span>`:''}</span><span class="task-date">${label}${time?`<small>${time}</small>`:''}</span></button>`}

$('enter').onclick=login;$('refresh').onclick=load;$('logout').onclick=logoutElite;$('newOwn').onclick=()=>openTaskForm();$('pushSettings').onclick=showNotificationSettings;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});if(session?.access_token){show();load()}
</script></body></html>
