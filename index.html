function workFilePrefix(workId){if(!session?.user?.id)throw Error('Inicia sesión de nuevo para adjuntar archivos.');return session.user.id+'/'+workId}
function storagePath(path){return path.split('/').map(encodeURIComponent).join('/')}
function workFilesPanel(id,area='workFiles'){const work=NATIVE_WORKS.find(w=>w.id===id);return `<section class="work-files"><h4>Fotos y PDF</h4><label class="file-upload-label">Adjuntar fotos o PDF<input type="file" ${work?.archived_at?'disabled':''} accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/heic,image/heif,application/pdf,.heic,.heif" multiple aria-label="Adjuntar fotos o PDF" onchange="uploadWorkFiles('${id}',this,'${area}')"></label><p class="small">Hasta 20 MB por archivo. Acceso privado con tu cuenta.${work?.archived_at?' Restaura la obra para añadir archivos.':''}</p><div id="${area}-status" class="status" role="status"></div><div id="${area}" class="work-file-grid"><p class="small">Cargando adjuntos…</p></div></section>`}
async function listWorkFiles(id){const prefix=workFilePrefix(id);let files=[];for(let offset=0;offset<10000;offset+=100){const page=await eliteRequest('/storage/v1/object/list/'+WORK_FILES_BUCKET,{method:'POST',body:JSON.stringify({prefix,limit:100,offset,sortBy:{column:'created_at',order:'desc'}})});if(!Array.isArray(page))throw Error('No se pudieron listar los adjuntos.');files.push(...page.filter(f=>f.id));if(page.length<100)return files}throw Error('Hay demasiados archivos para mostrarlos.');}
function workFileName(file){const mark=file.name.indexOf('__');return mark>=0?file.name.slice(mark+2):file.name}
async function signedWorkFile(id,file,download=false){const path=workFilePrefix(id)+'/'+file.name;const response=await eliteRequest('/storage/v1/object/sign/'+WORK_FILES_BUCKET+'/'+storagePath(path),{method:'POST',body:JSON.stringify({expiresIn:600})});const raw=response?.signedURL||response?.signedUrl;if(typeof raw!=='string')throw Error('No se pudo abrir el archivo.');const url=new URL(raw.startsWith('/object/')?'/storage/v1'+raw:raw,BASE);if(url.origin!==new URL(BASE).origin||!url.pathname.startsWith('/storage/v1/object/sign/'+WORK_FILES_BUCKET+'/'))throw Error('Enlace de archivo no válido.');if(download)url.searchParams.set('download',workFileName(file));return url.href}
async function refreshWorkFiles(id,area='workFiles'){const box=$(area);if(!box)return;try{const files=await listWorkFiles(id);if($(area)!==box)return;box.innerHTML=files.length?files.map((f,i)=>`<article class="work-file"><div id="${area}-preview-${i}"></div><b>${esc(workFileName(f))}</b><span class="small">${Math.ceil(Number(f.metadata?.size||0)/1024)} KB</span><div class="file-actions"><button type="button" class="light" onclick="openWorkFile('${id}','${encodeURIComponent(f.name).replace(/'/g,'%27')}',false,this)">Abrir</button><button type="button" class="light" onclick="openWorkFile('${id}','${encodeURIComponent(f.name).replace(/'/g,'%27')}',true,this)">Descargar</button></div></article>`).join(''):'<p class="small">Todavía no hay fotos ni PDF adjuntos.</p>';await Promise.allSettled(files.map(async(f,i)=>{const preview=$(area+'-preview-'+i);if(!preview||!String(f.metadata?.mimetype||'').startsWith('image/'))return;const url=await signedWorkFile(id,f);if($(area)!==box)return;const img=document.createElement('img');img.src=url;img.alt=workFileName(f);img.loading='lazy';img.className='work-file-photo';img.onerror=()=>{img.remove();};preview.appendChild(img)}));}catch(e){if($(area)===box)box.innerHTML='<p class="status err">'+esc(e.message)+'</p>';}}
async function detectWorkFile(file){if(!file||file.size<=0)throw Error('El archivo está vacío.');if(file.size>WORK_FILE_LIMIT)throw Error('El archivo supera los 20 MB.');const b=new Uint8Array(await file.slice(0,32).arrayBuffer()),text=(a,z)=>String.fromCharCode(...b.slice(a,z));if(b[0]===255&&b[1]===216&&b[2]===255)return 'image/jpeg';if(b[0]===137&&text(1,4)==='PNG'&&b[4]===13&&b[5]===10&&b[6]===26&&b[7]===10)return 'image/png';if(text(0,6)==='GIF87a'||text(0,6)==='GIF89a')return 'image/gif';if(text(0,4)==='RIFF'&&text(8,12)==='WEBP')return 'image/webp';if(text(0,5)==='%PDF-')return 'application/pdf';if(text(4,8)==='ftyp'){const brands=text(8,32);if(/avif|avis/.test(brands))return 'image/avif';if(/heic|heix|hevc|hevx/.test(brands))return 'image/heic';if(/mif1|msf1/.test(brands))return 'image/heif';}throw Error('Selecciona una foto JPEG, PNG, WebP, GIF, AVIF, HEIC o un PDF válido.');}
async function uploadWorkFiles(id,input,area='workFiles'){if(workFileBusy.has(id))return;const files=Array.from(input.files||[]);if(!files.length)return;const status=$(area+'-status');workFileBusy.add(id);input.disabled=true;let ok=0,errors=[];try{for(const file of files){if(status)status.textContent='Subiendo '+(ok+errors.length+1)+' de '+files.length+'…';try{const type=await detectWorkFile(file),name=String(file.name||'archivo').replace(/[\/\\\x00-\x1f]/g,'-').slice(0,180),key=crypto.randomUUID()+'__'+name,path=workFilePrefix(id)+'/'+key;await eliteRequest('/storage/v1/object/'+WORK_FILES_BUCKET+'/'+storagePath(path),{method:'POST',headers:{'Content-Type':type,'x-upsert':'false'},body:file});ok++;}catch(e){errors.push(file.name+': '+e.message)}}await refreshWorkFiles(id,area);if(status){status.textContent=(ok?ok+' archivo(s) guardado(s). ':'')+errors.join(' · ');status.className='status '+(errors.length?'err':'ok')}}finally{workFileBusy.delete(id);input.disabled=false;input.value=''}}
async function openWorkFile(id,encodedName,download,button){button.disabled=true;try{const name=decodeURIComponent(encodedName);if(name.includes('/')||name.includes('\\'))throw Error('Archivo no válido.');const url=await signedWorkFile(id,{name},download);const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';if(download)link.download=workFileName({name});document.body.appendChild(link);link.click();link.remove();}catch(e){statusMessage(e.message,true)}finally{button.disabled=false}}
async function removeWorkFiles(id,work){if(workFileBusy.has(id))throw Error('Espera a que termine la subida de archivos.');const rows=await eliteRequest('/rest/v1/elite_works?select=id&id=eq.'+id+'&updated_at=eq.'+encodeURIComponent(work.updated_at));if(!rows?.length)throw Error('La obra cambió. Actualiza antes de eliminar.');const files=await listWorkFiles(id);for(let i=0;i<files.length;i+=100){await eliteRequest('/storage/v1/object/'+WORK_FILES_BUCKET,{method:'DELETE',body:JSON.stringify({prefixes:files.slice(i,i+100).map(f=>workFilePrefix(id)+'/'+f.name)})});}}

async function patchWorkFields(work,data){const rows=await eliteRequest('/rest/v1/elite_works?id=eq.'+work.id+'&updated_at=eq.'+encodeURIComponent(work.updated_at),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(data)});if(!rows?.length)throw Error('La obra cambió en otro dispositivo. Actualiza y vuelve a intentarlo.');NATIVE_WORKS=NATIVE_WORKS.map(w=>w.id===work.id?{...w,...rows[0]}:w);DATA=nativeBoards(true);return rows[0]}

function openWorkAttachments(id){if(!NATIVE_WORKS.some(w=>w.id===id))return;dialogForm(`<div class="top"><h2>Fotos y PDF de la obra</h2><button type="button" id="closeTask" class="light" aria-label="Cerrar">✕</button></div>${workFilesPanel(id)}`);refreshWorkFiles(id)}
async function saveWorkDates(id){const w=NATIVE_WORKS.find(w=>w.id===id);if(!w)return;const start=$('detailWorkStart'),end=$('detailWorkEnd'),data={start_date:start.value||null,end_date:end.value||null};if(data.start_date&&data.end_date&&data.end_date<data.start_date){statusMessage('El fin debe ser posterior al inicio.',true);start.value=w.start_date||'';end.value=w.end_date||'';return}start.disabled=end.disabled=true;try{await patchWorkFields(w,data);statusMessage('Fechas de obra guardadas.')}catch(err){start.value=w.start_date||'';end.value=w.end_date||'';statusMessage(err.message,true)}finally{start.disabled=end.disabled=false}}
function detail(id){const w=NATIVE_WORKS.find(w=>w.id===id);if(!w)return;workDetailId=id;const b=nativeBoards(true).find(b=>b.id===id),cards=b.cards.filter(c=>!c.closed);$('title').textContent='Obra';$('content').innerHTML=`<div class="panel"><div class="task-toolbar"><button class="light" onclick="works()">← Obras</button><button class="dark" onclick="openTaskForm(null,'${id}')">+ Tarea</button><button class="light" onclick="openPlanning('${id}')">Gantt</button><button class="light" onclick="openContractors('${id}')">Subcontratas</button><button class="light" onclick="archiveWork('${id}')">${w.archived_at?'Restaurar':'Archivar'}</button><button class="light" onclick="confirmDeleteWork('${id}')">Eliminar obra</button></div>${workHeader(w)}${workTaskSections(cards,b)}<button class="light" onclick="showHistory('${id}')">Historial</button>${w.trello_id?'<button class="light" onclick="recoverLocalDates(\''+id+'\')">Recuperar fechas de este dispositivo</button>':''}</div>`}

let workDetailId=null;const taskCompletionBusy=new Set();
let draggedWorkId=null,workDragClickUntil=0,workMoveBusy=false;
async function toggleTaskComplete(id,checkbox){const t=OWN_TASKS.find(t=>t.id===id);if(!t||taskCompletionBusy.has(id)){checkbox.checked=!!t?.completed;return}const detailId=workDetailId,scroll=window.scrollY;taskCompletionBusy.add(id);checkbox.disabled=true;try{if(t.completed)await patchNativeTask(t,{completed:false,status:'pending'});else await eliteRequest('/rest/v1/rpc/elite_complete_task',{method:'POST',body:JSON.stringify({task_id:t.id,expected_updated_at:t.updated_at})});await fetchOwnTasks();if(detailId&&mode==='works')detail(detailId);else render();if(window.scrollTo)window.scrollTo(0,scroll);statusMessage(t.completed?'Tarea reabierta.':'Tarea completada. Disponible en Finalizadas.')}catch(e){checkbox.checked=!!t.completed;checkbox.disabled=false;statusMessage(e.message,true)}finally{taskCompletionBusy.delete(id)}}
function startWorkDrag(event,id){if(workMoveBusy){event.preventDefault();return}draggedWorkId=id;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',id);event.currentTarget.classList.add('dragging')}
function endWorkDrag(){draggedWorkId=null;workDragClickUntil=Date.now()+250;document.querySelectorAll('.dragging,.drop-target').forEach(e=>e.classList.remove('dragging','drop-target'))}
function overWorkState(event,section){if(workArchive||!draggedWorkId||!Object.hasOwn(WORK_STATES,section.dataset.workState))return;event.preventDefault();event.dataTransfer.dropEffect='move';section.classList.add('drop-target')}

async function dropWorkState(event,section){event.preventDefault();const id=draggedWorkId,state=section.dataset.workState;endWorkDrag();const w=NATIVE_WORKS.find(w=>w.id===id);if(workMoveBusy||workArchive||!w||!Object.hasOwn(WORK_STATES,state)||workState(w)===state)return;workMoveBusy=true;try{const rows=await eliteRequest('/rest/v1/elite_works?id=eq.'+id+'&updated_at=eq.'+encodeURIComponent(w.updated_at),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({execution_state:state})});if(!rows?.length)throw Error('La obra cambió. Actualiza y vuelve a intentarlo.');await load();works();statusMessage('Obra movida a '+WORK_STATES[state]+'.')}catch(e){statusMessage(e.message,true)}finally{workMoveBusy=false}}
function confirmDeleteWork(id){const w=NATIVE_WORKS.find(w=>w.id===id);if(!w)return;dialogForm(`<form id="deleteWorkForm"><div class="top"><h2>Eliminar obra definitivamente</h2><button type="button" id="closeTask" class="light">Cancelar</button></div><p>Se borrará <b>${esc(w.name)}</b> con todas sus tareas, checklists, planificación, mediciones, fotos, PDF e historial. No se puede recuperar.</p><p>Los contactos del registro de subcontratas se conservan.</p><label>Escribe el nombre de la obra para confirmar<input id="deleteWorkName" required autocomplete="off"></label><div id="deleteWorkStatus" role="status" class="status err"></div><div class="form-actions"><button type="submit" class="danger">Eliminar definitivamente</button></div></form>`);$('deleteWorkForm').onsubmit=async e=>{e.preventDefault();if($('deleteWorkName').value!==w.name){$('deleteWorkStatus').textContent='El nombre no coincide.';return}const button=e.submitter;button.disabled=true;try{await removeWorkFiles(id,w);await eliteRequest('/rest/v1/rpc/elite_delete_work',{method:'POST',body:JSON.stringify({target_work:id,expected_updated_at:w.updated_at})});closeTaskDialog();mode='works';await load();works();statusMessage('Obra eliminada definitivamente.')}catch(err){$('deleteWorkStatus').textContent=err.message;button.disabled=false}}}

function taskMatches(c,q){return (!q||[c.name,c.description,c.board.name,c.stage,...(c.labels||[]).map(l=>typeof l==='string'?l:l.name||l.color)].join(' ').toLocaleLowerCase('es').includes(q))&&(taskPriority==='all'||c.priority===taskPriority)&&(taskState==='all'||c.status===taskState)&&(taskWork==='all'||c.board.id===taskWork)}
function renderTaskResults(){const q=taskQuery.trim().toLocaleLowerCase('es');const cards=taskBoards().flatMap(b=>b.cards.map(c=>({...c,board:b}))).filter(c=>(taskFilter==='archived'?c.closed:!c.closed)&&(taskSource==='all'||taskSource===c.category)&&(taskFilter==='archived'||(taskFilter==='done'?taskDone(c):!taskDone(c)&&(taskFilter==='dated'?!!validTaskDate(c):taskFilter==='undated'?!validTaskDate(c):true)))&&taskMatches(c,q));const dated=cards.filter(validTaskDate),undated=cards.filter(c=>!validTaskDate(c));$('taskResults').innerHTML=`<div class="task-summary">${dated.length} tareas con fecha · Toca para editar</div>`+(cards.length?(taskFilter==='undated'||taskFilter==='done'||taskFilter==='archived'?groupedTaskList(cards):datedTaskList(dated)+(undated.length?'<h3 class="agenda-heading">Sin fecha</h3>'+groupedTaskList(undated):'')):'<div class="empty-tasks">No hay tareas en esta vista.</div>')}
function tasks(filter=taskFilter){if(filter==='pending')filter='dated';taskFilter=filter;$('title').textContent=filter==='dated'?'Tareas con fecha':'Tareas';$('content').innerHTML='<div class="task-shortcuts"><button type="button" onclick="openContractors()">Subcontratas</button><button type="button" onclick="openPlanningWorks()">Gantts</button><button type="button" onclick="openFollowup()">Seguimiento</button></div><div class="tasks-controls"><div class="task-toolbar task-tabs"><button class="dark task-add" onclick="openTaskForm()">+ Tarea</button>'+[['dated','Con fecha'],['undated','Sin fecha'],['all','Todas'],['done','Hechas'],['archived','Archivo']].map(([v,l])=>`<button class="${v===filter?'dark':'light'}" onclick="tasks('${v}')">${l}</button>`).join('')+`</div></div><details class="filter-details"><summary>Filtros${taskQuery||taskPriority!=='all'||taskState!=='all'||taskWork!=='all'||taskSource!=='all'?' · activos':''}</summary><div id="taskSearchPanel" class="task-search-row"><input id="taskSearch" class="task-search" type="search" placeholder="Buscar tarea, obra o etiqueta…" aria-label="Buscar tarea, obra o etiqueta" value="${esc(taskQuery)}"></div><div class="task-toolbar"><select id="taskSource" class="task-source" aria-label="Tipo de tareas">${fieldOptions({all:'Todas',personal:'Personales',work:'Trabajo'},taskSource)}</select><select id="filterPriority" aria-label="Prioridad">${fieldOptions({all:'Todas las prioridades',...PRIORITY_NAMES},taskPriority)}</select><select id="filterState" aria-label="Estado">${fieldOptions({all:'Todos los estados',...STATUS_NAMES},taskState)}</select><select id="filterWork" aria-label="Obra">${fieldOptions({all:'Todas las obras',...Object.fromEntries(taskBoards().map(b=>[b.id,b.name]))},taskWork)}</select></div></details><div id="taskResults"></div>`;$('taskSearch').oninput=e=>{taskQuery=e.target.value;renderTaskResults()};$('taskSource').onchange=e=>{taskSource=e.target.value;renderTaskResults()};$('filterPriority').onchang function openPlanning(id){planningWork=id;const work=NATIVE_WORKS.find(w=>w.id===id),plan=planOf(id),stats=ElitePlanning.summary(plan,planningToday());$('title').textContent=work.name;$('content').innerHTML=`<div class="panel"><div class="task-toolbar"><button class="light" onclick="detail('${id}')">← Obra</button><button class="dark" onclick="editPlan('${id}')">Editar fases</button><button class="light" onclick="openContractors('${id}')">Subcontratas</button></div><h3>${esc(work.name)}</h3><div class="plan-status ${stats.delta>0?'delayed':stats.delta<0?'ahead':''}">${esc(stats.status)}</div><div class="planning-metrics"><span>Inicio previsto <b>${workDateLabel(planningStartDate(plan,work))}</b></span><span>Fin original <b>${workDateLabel(stats.originalEnd)}</b></span><span>Fin actual estimado <b>${workDateLabel(stats.currentEnd)}</b></span><span>Previsto original <b>${stats.planned===null?'Sin fijar':planningNumber(stats.planned)+' %'}</b></span><span>Real <b>${stats.actual===null?'Sin mediciones':planningNumber(stats.actual)+' %'}</b></span><span>Desviación <b>${planningNumber(stats.deviation)} puntos</b></span></div><p class="small">${plan.confirmed_at?'🟢 OBRA CONFIRMADA · '+esc(new Date(plan.confirmed_at).toLocaleString('es-ES')):'Obra aún sin confirmar'}</p>${renderGantt(plan)}${renderPhysicalCurve(plan)}<p class="small">Fechas en días naturales, incluidos inicio y fin. Las dependencias son fin → inicio. Avance previsto: interpolación por fase según su peso físico. Avance real: últimas mediciones que registres; nunca se estima por días transcurridos.</p><div id="planningError" class="status err" role="status"></div>${renderCapacityAlerts(id)}${renderRequests(plan,work)}</div>`;}
function renderGantt(plan){const phases=plan.phases||[],base=plan.baseline||[];if(!phases.length)return '<p class="small">Añade las fases principales para crear el Gantt.</p>';const dates=[...phases,...base].flatMap(p=>[ElitePlanning.day(p.start),ElitePlanning.day(p.end)]),first=Math.min(...dates),last=Math.max(...dates),span=last-first+1,today=ElitePlanning.day(planningToday()),now=(today-first)/span*100;const bar=(p,cls)=>`<div class="gantt-bar ${cls}" style="left:${(ElitePlanning.day(p.start)-first)/span*100}%;width:${(ElitePlanning.day(p.end)-ElitePlanning.day(p.start)+1)/span*100}%" title="${esc(p.start+' → '+p.end)}"></div>`;const shortDate=d=>workDateLabel(ElitePlanning.date(d)).slice(0,5),ticks=[first,Math.floor((first+last)/2),last];return `<h3>Gantt</h3><p class="small gantt-range">${workDateLabel(ElitePlanning.date(first))} → ${workDateLabel(ElitePlanning.date(last))} · ${base.length?'Clara: original · Verde: actual':'Verde: actual'}</p><div class="gantt-fit"><div class="gantt-head"><span>Fase · subcontrata</span><div class="gantt-axis">${ticks.map((d,i)=>`<span class="tick-${i}">${shortDate(d)}</span>`).join('')}</div></div>${phases.map(p=>{const original=base.find(b=>b.id===p.id),c=CONTRACTORS.find(c=>c.id===p.contractor_id);return `<div class="gantt-row"><span class="gantt-label"><b>${esc(p.name)}</b><small>${esc(c?.name||'Sin subcontrata')}</small><small class="gantt-phase-dates">${workDateLabel(p.start)}<br>→ ${workDateLabel(p.end)}</small></span><div class="gantt-track">${original?bar(original,'original'):''}${bar(p,'current')}${now>=0&&now<=100?`<i class="gantt-today" style="left:${now}%"><em>HOY</em></i>`:''}</div></div>`}).join('')}</div>`;}
function renderPhysicalCurve(plan){const provisional=!(plan.baseline||[]).length,displayPlan={...plan,baseline:provisional?plan.phases:plan.baseline},points=ElitePlanning.curve(displayPlan,planningToday());if(points.length<2)return '<p class="small">Añade fases y fechas para ver la curva de avance.</p>';const first=ElitePlanning.day(points[0].date),last=ElitePlanning.day(points.at(-1).date),span=Math.max(1,last-first),x=d=>45+(ElitePlanning.day(d)-first)/span*590,y=v=>170-v*1.4;const expected=points.filter(p=>p.planned!==null).map(p=>x(p.date)+','+y(p.planned)).join(' '),actual=points.filter(p=>p.actual!==null);let path='';actual.forEach((p,i)=>{path+=(i?' H '+x(p.date)+' V '+y(p.actual):'M '+x(p.date)+' '+y(p.actual))});const now=x(planningToday()),latest=actual.at(-1);return `<h3>Curva S · avance físico</h3>${provisional?'<p class="planning-notice">Previsión provisional basada en las fechas actuales. Para fijar la referencia de comparación, entra en Editar fases y pulsa «Guardar original y actual» cuando la hayas revisado.</p>':''}${!latest?'<p class="planning-notice">Aún no hay mediciones de avance real. Registra el porcentaje físico medido en cada fase desde Editar fases.</p>':`<p class="small">Avance real registrado: <b>${planningNumber(latest.actual)} %</b>. ${actual.length===1?'La primera medición se representa con un punto verde.':''}</p>`}<svg class="physical-curve" viewBox="0 0 680 210" role="img" aria-label="${provisional?'Previsión provisional':'Avance físico previsto'} y avance real registrado a lo largo del tiempo">${[0,25,50,75,100].map(v=>`<line x1="45" x2="635" y1="${y(v)}" y2="${y(v)}" stroke="#e4e8ec"/><text x="5" y="${y(v)+4}">${v}%</text>`).join('')}<polyline fill="none" stroke="#799bbd" stroke-width="3" ${provisional?'stroke-dasharray="6 4"':''} points="${expected}"/><path fill="none" stroke="#00877d" stroke-width="3" d="${path}"/>${actual.map(p=>`<circle class="actual-progress-point" cx="${x(p.date)}" cy="${y(p.actual)}" r="4" fill="#00877d"><title>${esc(workDateLabel(p.date))}: ${planningNumber(p.actual)} % real registrado</title></circle>`).join('')}<line x1="${now}" x2="${now}" y1="20" y2="170" stroke="#d34343" stroke-dasharray="4 4"/><text x="${now+3}" y="16">HOY</text><text x="45" y="195">${workDateLabel(points[0].date)}</text><text x="540" y="195">${workDateLabel(points.at(-1).date)}</text></svg><p class="small">Azul: ${provisional?'previsión provisional':'previsto original'} · Verde: avance real registrado${!latest?' (sin mediciones todavía)':''}</p>`;}
function capacityPlans(){return WORK_PLANS.map(p=>({...p,archived:!!NATIVE_WORKS.find(w=>w.id===p.work_id)?.archived_at}))}
function renderCapacityAlerts(id){const conflicts=ElitePlanning.capacity(capacityPlans(),CONTRACTORS).filter(c=>c.works.includes(id));return conflicts.length?`<h3>Conflictos de subcontratas</h3>${conflicts.map(c=>`<div class="capacity-alert"><b>${esc(c.name)}</b> · ${c.days} días de solapamiento<br>${workDateLabel(c.start)} → ${workDateLabel(c.end)} · Capacidad ${c.capacity}<br><span class="small">${c.works.map(id=>esc(NATIVE_WORKS.find(w=>w.id===id)?.name||id)).join(' · ')}</span></div>`).join('')}`:'';}
function renderRequests(plan,work){const rows=ElitePlanning.requests(plan,work,CONTRACTORS,planningToday());if(!rows.length)return '';return `<h3>Solicitudes preparadas</h3><p class="small">Borradores a partir de los datos guardados. El envío desde Outlook todavía no está conectado. Revisa cada solicitud; no se envía nada desde esta vista.</p>${rows.map(r=>`<details class="task-group"><summary>${esc(plan.phases.find(p=>p.id===r.phase_id)?.name)} · ${r.status==='confirmed'?'🟢 CONFIRMADO':r.status==='requested'?'🟠 SOLICITADO':'🔴 PENDIENTE'}</summary><p>Contacto previsto: ${workDateLabel(r.contact_date)}</p>${r.missing.length?`<p class="status err">Falta: ${esc(r.missing.join(', '))}</p>`:''}<p class="small">Destinatario: ${esc(r.to||'Pendiente')}<br>Asunto: ${esc(r.subject)}</p><pre class="request-draft">${esc(r.body)}</pre>${r.confirmed_at?`<p class="small">Confirmado: ${esc(new Date(r.confirmed_at).toLocaleString('es-ES'))}</p>`:''}</details>`).join('')}`;}
function editPlan(id){planningWork=id;const plan=planOf(id);phaseDraft=structuredClone(plan.phases);dialogForm(`<form id="planForm"><div class="top"><h2>Fases principales</h2><button id="closeTask" type="button" class="light">✕</button></div><p class="small">Define pesos físicos que sumen 100 %. «Guardar original» fija la primera planificación y no se puede sobrescribir después.</p><div id="phaseEditor"></div><button type="button" class="light" id="addPhase">+ Fase</button><label><input id="confirmWork" type="checkbox" ${plan.confirmed_at?'checked':''}> OBRA CONFIRMADA</label><div id="planningError" class="status err" role="status"></div><div class="form-actions"><button class="dark" type="submit">Guardar actual</button>${!plan.baseline_at?'<button class="light" type="button" id="freezePlan">Guardar original y actual</button>':''}</div></form>`);renderPhaseEditor();$('addPhase').onclick=()=>{try{collectPhaseDraft();const w=NATIVE_WORKS.find(w=>w.id===id);phaseDraft.push({id:crypto.randomUUID(),name:'',start:w.start_date||'',end:w.end_date||'',weight:phaseDraft.length?0:100,depends_on:[],observations:[],contractor_id:null,request_status:'pending',scope:'',contact_days:null});renderPhaseEditor()}catch(e){planningError(e.message)}};$('planForm').onsubmit=e=>{e.preventDefault();savePlan(false)};if($('freezePlan'))$('freezePlan').onclick=()=>savePlan(true);}
function renderPhaseEditor(){$('phaseEditor').innerHTML=phaseDraft.map((p,i)=>`<details class="phase-editor" open><summary>${esc(p.name||'Nueva fase')}</summary><label>Nombre<input id="phaseName${i}" maxlength="160" required value="${esc(p.name)}"></label><div class="form-pair"><label>Inicio<input id="phaseStart${i}" type="date" required value="${esc(p.start)}"></label><label>Fin actual estimado<input id="phaseEnd${i}" type="date" required value="${esc(p.end)}"></label></div><div class="form-pair"><label>Peso físico %<input id="phaseWeight${i}" type="number" step="0.01" min="0.01" max="100" required value="${p.weight}"></label><label>Avance físico medido hoy %<input id="phaseProgress${i}" type="number" step="0.1" min="0" max="100" value="${p.observations?.length?ElitePlanning.progress([{...p,weight:100}],planningToday()):''}" placeholder="Sin medición"></label></div><label>Subcontrata<select id="phaseContractor${i}"><option value="">Sin asignar</option>${CONTRACTORS.filter(c=>!c.archived_at||c.id===p.contractor_id).map(c=>`<option value="${c.id}" ${p.contractor_id===c.id?'selected':''}>${esc(c.name)} · capacidad ${c.capacity}</option>`).join('')}</select></label><label>Predecesora<select id="phaseDepends${i}"><option value="">Sin dependencia</option>${phaseDraft.filter(f=>f.id!==p.id).map(f=>`<option value="${f.id}" ${(p.depends_on||[]).includes(f.id)?'selected':''}>${esc(f.name||'Fase sin nombre')}</option>`).join('')}</select></label><details><summary>Contratación</summary><label>Alcance<textarea id="phaseScope${i}">${esc(p.scope||'')}</textarea></label><label>Contactar con antelación de días<input id="phaseContact${i}" type="number" min="0" max="365" value="${p.contact_days??''}"></label><label>Estado<select id="phaseRequest${i}">${fieldOptions({pending:'🔴 PENDIENTE',requested:'🟠 SOLICITADO',confirmed:'🟢 CONFIRMADO'},p.request_status||'pending')}</select></label><p class="small">Marca solicitado cuando hayas enviado la petición; confirmado cuando recibas la respuesta. Elite registra la fecha de confirmación.</p></details></details>`).join('')}
function collectPhaseDraft(){phaseDraft=phaseDraft.map((p,i)=>{const dep=$('phaseDepends'+i).value,measure=$('phaseProgress'+i).value,observations=structuredClone(p.observations||[]);if(measure!==''){const percent=Number(measure),previous=ElitePlanning.progress([{...p,weight:100}],planningToday());if(!observations.length||percent!==previous){const today=planningToday(),old=observations.find(o=>o.date===today);if(old)old.percent=percent;else observations.push({date:today,percent});}}return {...p,name:$('phaseName'+i).value.trim(),start:$('phaseStart'+i).value,end:$('phaseEnd'+i).value,weight:Number($('phaseWeight'+i).value),contractor_id:$('phaseContractor'+i).value||null,depends_on:dep?[dep]:[],observations,scope:$('phaseScope'+i).value.trim(),contact_days:$('phaseContact'+i).value===''?null:Number($('phaseContact'+i).value),request_status:$('phaseRequest'+i).value}})}
async function savePlan(freeze){try{collectPhaseDraft();const phases=ElitePlanning.propagate(phaseDraft);planPayload={target_work:planningWork,new_phases:phases,expected_revision:planOf(planningWork).revision,freeze_baseline:freeze,confirm_work:$('confirmWork').checked,exception_reason:''};const candidate=[...capacityPlans().filter(p=>p.work_id!==planningWork),{work_id:planningWork,phases}],conflicts=ElitePlanning.capacity(candidate,CONTRACTORS).filter(c=>c.works.includes(planningWork));if(conflicts.length){showCapacityOverride(conflicts);return}await persistPlan();}catch(e){planningError(e.message)}}
function showCapacityOverride(conflicts){dialogForm(`<div class="top"><h2>Conflicto de subcontrata</h2><button id="closeTask" class="light">✕</button></div>${conflicts.map(c=>`<p>${esc(c.name)} · ${c.days} días · ${workDateLabel(c.start)} → ${workDateLabel(c.end)}. Capacidad insuficiente.</p>`).join('')}<label>Motivo de la excepción<textarea id="overrideReason" maxlength="2000" placeholder="Indica por qué autorizas el solapamiento"></textarea></label><div id="planningError" class="status err" role="status"></div><div class="form-actions"><button class="light" id="adjustPlan">Cambiar fechas / subcontrata</button><button class="dark" id="overridePlan">Habilitar igualmente</button></div>`);$('adjustPlan').onclick=()=>{const draft=structuredClone(planPayload.new_phases);editPlan(planningWork);phaseDraft=draft;renderPhaseEditor()};$('overridePlan').onclick=async()=>{const reason=$('overrideReason').value.trim();if(!reason){planningError('Indica el motivo para registrar la excepción.');return}planPayload.exception_reason=reason;try{await persistPlan()}catch(e){planningError(e.message)}};}
async function persistPlan(){document.querySelectorAll('#taskDialog button').forEach(b=>b.disabled=true);try{await eliteRequest('/rest/v1/rpc/elite_save_plan',{method:'POST',body:JSON.stringify(planPayload)});closeTaskDialog();await load();openPlanning(planningWork);statusMessage('Planificación guardada.')}finally{document.querySelectorAll('#taskDialog button').forEach(b=>b.disabled=false)}}
function openContractorDirectory(workId=null){planningWork=workId;$('title').textContent='Subcontratas y proveedores';$('content').innerHTML=`<div class="panel"><div class="task-toolbar"><button class="light" onclick="${workId?"detail('"+workId+"')":"works()"}">${workId?"← Obra":"← Obras"}</button><button class="dark" onclick="editContractor()">+ Registro</button><button class="light" onclick="openContractors(planningWork)">Cuadro de control</button></div><div id="planningError" class="status err" role="status"></div>${CONTRACTORS.filter(c=>!c.archived_at).map(c=>`<button class="compact-task" onclick="editContractor('${c.id}')"><span><b>${esc(c.name)}</b><small>${esc(c.trade)} · ${c.kind==='supplier'?'Proveedor':'Subcontrata'}</small></span><span>Capacidad ${c.capacity}</span></button>`).join('')||'<p class="small">Añade los contactos y su capacidad real. Elite no inventa subcontratas ni disponibilidades.</p>'}</div>`;}
function editContractor(id){const c=CONTRACTORS.find(c=>c.id===id)||{name:'',kind:'subcontractor',trade:'',email:'',phone:'',capacity:'',notes:''};dialogForm(`<form id="contractorForm"><div class="top"><h2>${id?'Editar contacto':'Nuevo contacto'}</h2><button id="closeTask" type="button" class="light">✕</button></div><label>Nombre<input id="contractorName" required maxlength="160" value="${esc(c.name)}"></label><label>Tipo<select id="contractorKind">${fieldOptions({subcontractor:'Subcontrata',supplier:'Proveedor'},c.kind)}</select></label><label>Especialidad<input id="contractorTrade" value="${esc(c.trade)}"></label><label>Correo<input id="contractorEmail" type="email" value="${esc(c.email)}"></label><label>Teléfono<input id="contractorPhone" type="tel" value="${esc(c.phone)}"></label><label>Capacidad simultánea (obras)<input id="contractorCapacity" type="number" required min="1" max="50" value="${c.capacity}"></label><label>Notas<textarea id="contractorNotes">${esc(c.notes)}</textarea></label><div id="planningError" class="status err" role="status"></div><button class="dark">Guardar contacto</button></form>`);$('contractorForm').onsubmit=async e=>{e.preventDefault();const data={name:$('contractorName').value.trim(),kind:$('contractorKind').value,trade:$('contractorTrade').value.trim(),email:$('contractorEmail').value.trim(),phone:$('contractorPhone').value.trim(),capacity:Number($('contractorCapacity').value),notes:$('contractorNotes').value};try{const rows=await eliteRequest('/rest/v1/elite_contractors'+(id?'?id=eq.'+id+'&updated_at=eq.'+encodeURIComponent(c.updated_at):''),{method:id?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(data)});if(!rows?.length)throw Error('El contacto cambió. Actualiza antes de guardar.');closeTaskDialog();await load();openContractors(planningWork)}catch(e){planningError(e.message)}};}

let aiTab='corrections',aiData={corrections:[],learnings:[]},aiSequence=0,aiBusy=false;
const AI_LABELS={awaiting_confirmation:'Por confirmar interpretación',confirmed:'Interpretación confirmada',dismissed:'Descartada',pending:'Pendiente de aprobación',approved:'Conocimiento aprobado',rejected:'Rechazado'};
function openEliteIA(){mode='ai';location.hash='ia';render();}
function aiSource(url){try{const u=new URL(url);return u.protocol==='https:'&&['chatgpt.com','chat.openai.com'].includes(u.hostname)&&!u.username&&!u.password?`<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">Conversación de origen ↗</a>`:''}catch{return ''}}
function aiText(label,value){return value?`<div class="ai-field"><b>${label}</b><p>${esc(value)}</p></div>`:''}
function aiRecord(r,correction){return `<article class="panel ai-card"><span class="ai-badge ${esc(r.status)}">${esc(AI_LABELS[r.status]||r.status)}</span><h3>${esc(correction?r.proposed_interpretation:r.title)}</h3><p class="small">${esc(r.work_name||'Criterio general')} · ${fd(r.created_at)} · Versión ${Number(r.version)}</p>${correction?aiText('Tu corrección',r.original_correction):aiText('Conclusión',r.conclusion)}${aiText('Fundamento',r.rationale)}${aiText('Condiciones de aplicación',r.applicability)}${aiSource(r.source_chat_url)}<div class="form-actions">${correction&&r.status==='awaiting_confirmation'?`<button class="dark" data-ai="interpret" data-id="${esc(r.id)}">Revisar interpretación</button>`:''}${!correction&&r.status==='pending'?`<button class="dark" data-ai="review" data-id="${esc(r.id)}">Revisar aprendizaje</button>`:''}<button class="light" data-ai="${correction?'correction-history':'learning-history'}" data-id="${esc(r.id)}">Historial</button></div></article>`;}
async function renderEliteIA(){
 const seq=++aiSequence;$('title').textContent='Élite IA';
 $('content').innerHTML='<div class="panel" role="status">Cargando bandeja…</div>';
 try{const [corrections,learnings]=await Promise.all([readAll('elite_ai_corrections','order=created_at.desc,id.asc'),readAll('elite_ai_learnings','order=created_at.desc,id.asc')]);if(seq!==aiSequence||mode!=='ai')return;aiData={corrections,learnings};renderAIContents();}catch(e){if(seq===aiSequence&&mode==='ai')$('content').innerHTML=`<div class="panel"><p class="status err" role="alert">No se pudo cargar la bandeja: ${esc(e.message)}</p><button class="light" data-ai="retry">Reintentar</button></div>`;bindAIActions();}
}
function renderAIContents(){
 const waiting=aiData.corrections.filter(r=>r.status==='awaiting_confirmation'),pending=aiData.learnings.filter(r=>r.status==='pending'),approved=aiData.learnings.filter(r=>r.status==='approved'),rejected=aiData.learnings.filter(r=>r.status==='rejected'),history=aiData.corrections.filter(r=>r.status!=='awaiting_confirmation');
 const groups={corrections:waiting,pending,approved,rejected,history};
 const tabs=[['corrections','Interpretaciones',waiting.length],['pending','Por aprobar',pending.length],['approved','Aprobados',approved.length],['rejected','Rechazados',rejected.length],['history','Correcciones revisadas',history.length]];
 const overdue=OWN_TASKS.filter(t=>!t.completed&&!t.deleted_at&&t.due_at&&new Date(t.due_at)<new Date()).length;
 $('content').innerHTML=`<section class="panel ai-intro"><div><h2>Tu bandeja de aprendizajes</h2><p>Primero confirmas qué has enseñado. Después decides si se guarda como conocimiento permanente.</p></div><div class="form-actions"><button class="dark" data-ai="task">+ Tarea</button><button class="light" data-ai="overdue">Vencidas · ${overdue}</button></div><p class="small">Las propuestas pendientes se conservan hasta que las revises. La captura automática de todos los chats todavía no está disponible.</p></section><div class="ai-tabs" role="group" aria-label="Estado de revisión">${tabs.map(([key,label,count])=>`<button class="${key===aiTab?'dark':'light'}" data-ai="tab" data-tab="${key}" aria-pressed="${key===aiTab}">${label} <span>${count}</span></button>`).join('')}</div><div class="ai-cards">${groups[aiTab].map(r=>aiRecord(r,aiTab==='corrections'||aiTab==='history')).join('')||'<div class="panel empty-tasks">No hay registros en este grupo.</div>'}</div>`;

}
function bindAIActions(){document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{const action=b.dataset.ai;if(action==='tab'){aiTab=b.dataset.tab;renderAIContents()}else if(action==='back')renderAIContents();else if(action==='retry')renderEliteIA();else if(action==='task')openTaskForm();else if(action==='overdue')aiOverdue();else if(action==='interpret')aiInterpret(b.dataset.id);else if(action==='review')aiReview(b.dataset.id);else aiHistory(b.dataset.id,action==='correction-history');});}
function aiOverdue(){const rows=OWN_TASKS.filter(t=>!t.completed&&!t.deleted_at&&t.due_at&&new Date(t.due_at)<new Date()).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at));$('content').innerHTML=`<div class="panel"><button class="light" data-ai="back">← Bandeja</button><h2>Tareas vencidas</h2>${rows.map(t=>`<button class="compact-task own-task" data-overdue-id="${esc(t.id)}"><span class="task-copy"><b class="task-name">${esc(t.title)}</b><small>${esc(t.work_name||'Sin obra')}</small></span><span class="task-date">${fd(t.due_at)}</span></button>`).join('')||'<p>No hay tareas vencidas.</p>'}</div>`;bindAIActions();document.querySelectorAll('[data-overdue-id]').forEach(b=>b.onclick=()=>openTaskForm(b.dataset.overdueId));}
function aiDialog(content){dialogForm(`<div class="top"><h2>Revisión de Élite IA</h2><button id="closeTask" type="button" class="light" aria-label="Cerrar">✕</button></div>${content}<div id="aiError" class="status err" role="alert"></div>`);}
function aiInterpret(id){

 $('content').innerHTML=`<div class="panel follow-panel"><div class="task-toolbar"><button class="light" onclick="mode='tasks';render()">← Tareas</button><button class="dark" onclick="editDailyReport()">+ Parte diario</button><button class="light" onclick="followHistory=!followHistory;followWork='';renderFollowup()">${followHistory?'Ver en ejecución':'Histórico de obras'}</button></div><h2>Seguimiento de obras ${followHistory?'· Histórico':'en ejecución'}</h2><div class="follow-filters"><select id="followWork" aria-label="Obra de seguimiento"><option value="">Todas ${followHistory?'con partes':'en ejecución'}</option>${works.map(w=>`<option value="${w.id}" ${followWork===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select><select id="followRange" aria-label="Periodo">${fieldOptions({'1':'Hoy','7':'Últimos 7 días','30':'Últimos 30 días',all:'Todo el historial'},followRange)}</select></div><div class="follow-metrics"><div><small>Obras</small><b>${count}</b></div><div><small>Horas · jornales</small><b>${followNumber(totals.labor.hours)} h · ${followNumber(totals.labor.days)} j</b></div><div><small>Importe valorado</small><b>${followMoney(totals.valued)}</b></div><div><small>Administración · MO</small><b>${followMoney(totals.admin.valued)}</b></div><div><small>Incidencias abiertas</small><b class="${totals.open?'err':''}">${totals.open}</b></div></div><p class="small">${reports.length} partes en el periodo · Importes sin IVA.${totals.unpriced?` <b>${totals.unpriced} partidas sin precio: valoración parcial.</b>`:''} Las horas y los jornales se contabilizan por separado.</p><div id="followError" class="status err" role="status"></div><div class="follow-work-grid">${works.filter(w=>!followWork||w.id===followWork).map(w=>{const rs=reports.filter(r=>r.work_id===w.id),latest=DAILY_REPORTS.filter(r=>r.work_id===w.id&&r.report_date<=today).sort((a,b)=>b.report_date.localeCompare(a.report_date))[0],measured=DAILY_REPORTS.filter(r=>r.work_id===w.id&&r.report_date<=today&&r.progress_pct!==null&&r.progress_pct!==undefined).sort((a,b)=>b.report_date.localeCompare(a.report_date))[0],last=followTotals(rs),todayPart=DAILY_REPORTS.find(r=>r.work_id===w.id&&r.report_date===today);return `<article class="follow-work"><h3>${esc(w.name)}</h3><p class="small">${latest?'Último parte: '+workDateLabel(latest.report_date):'Todavía sin partes'}</p><div class="follow-work-stats"><span>Avance físico medido<b>${measured?followNumber(measured.progress_pct)+' %':'Sin medición'}</b>${measured?'<small>'+workDateLabel(measured.report_date)+'</small>':''}</span><span>Operarios · último parte<b>${latest?followNumber(followCost(latest.labor).quantity):'—'}</b></span><span>Máquinas · último parte<b>${latest?followNumber(followCost(latest.machines).quantity):'—'}</b></span><span>Valorado · periodo<b>${followMoney(last.valued)}</b>${last.unpriced?'<small>Parcial · faltan precios</small>':''}</span></div>${last.open?`<p class="err">${last.open} incidencias abiertas en el periodo</p>`:''}<button class="dark" onclick="editDailyReport('${todayPart?.id||''}','${w.id}')">${todayPart?'Editar parte de hoy':'Parte de hoy'}</button><button class="light" onclick="followWork='${w.id}';followRange='all';renderFollowup()">Ver partes</button></article>`}).join('')||'<p class="small">No hay obras en esta vista. Puedes cambiar su estado desde Obras o consultar el histórico.</p>'}</div><h3>Partes diarios · ${followHistory?'Histórico':'En ejecución'}</h3><div class="follow-report-list">${reports.map(r=>{const t=followTotals([r]);return `<button class="follow-report" onclick="editDailyReport('${r.id}')"><span><b>${workDateLabel(r.report_date)} · ${esc(NATIVE_WORKS.find(w=>w.id===r.work_id)?.name||'Obra')}</b><small>${followCost(r.labor).quantity} operarios · ${followNumber(t.labor.hours)} h · ${followNumber(t.labor.days)} jornales · ${t.open} incidencias abiertas</small></span><span>${followMoney(t.valued)}${t.unpriced?'<small>Parcial</small>':''}</span></button>`}).join('')||'<p class="small">No hay partes en el periodo seleccionado.</p>'}</div></div>`;
 $('followWork').onchange=e=>{followWork=e.target.value;renderFollowup()};$('followRange').onchange=e=>{followRange=e.target.value;renderFollowup()};
}
function followNum(id,required=false,max=1000000){const v=$(id).value;if(v===''){if(required)throw Error('Completa cantidades y duración de cada fila.');return null}const n=Number(v);if(!Number.isFinite(n)||n<0||n>max)throw Error('Revisa los valores numéricos.');return n}
function collectFollowRows(kind,strict=true){return followDraft[kind].map((r,i)=>{const name=$('fr-'+kind+'-name-'+i).value.trim();if(strict&&!name)throw Error('Indica el oficio, empresa, máquina o incidencia de cada fila.');if(kind==='incidents')return {...r,name,state:$('fr-'+kind+'-state-'+i).value,severity:$('fr-'+kind+'-severity-'+i).value};const num=(field,max)=>strict?followNum('fr-'+kind+'-'+field+'-'+i,true,max):($('fr-'+kind+'-'+field+'-'+i).value===''?null:Number($('fr-'+kind+'-'+field+'-'+i).value));const quantity=num('quantity',500),unit=$('fr-'+kind+'-unit-'+i).value,duration=num('duration',unit==='hour'?24:1),rate=strict?followNum('fr-'+kind+'-rate-'+i):($('fr-'+kind+'-rate-'+i).value===''?null:Number($('fr-'+kind+'-rate-'+i).value));if(strict&&(!Number.isInteger(quantity)||quantity<1||duration<=0))throw Error('La cantidad debe ser entera y la duración mayor que cero.');return {...r,name,quantity,unit,duration,rate,...(kind==='labor'?{admin:$('fr-'+kind+'-admin-'+i).checked}:{})}})}
function collectFollowDraft(strict=true){followDraft.work_id=$('dailyWork').value;followDraft.report_date=$('dailyDate').value;followDraft.progress_pct=followNum('dailyProgress',false,100);followDraft.progress_note=$('dailyProgressNote').value;followDraft.notes=$('dailyNotes').value;for(const k of ['labor','machines','incidents'])followDraft[k]=collectFollowRows(k,strict);return followDraft}
function changeFollowRows(kind,index=null){try{collectFollowDraft(false);if(index===null)followDraft[kind].push(kind==='incidents'?{name:'',state:'open',severity:'warning'}:{name:'',quantity:null,unit:'hour',duration:null,rate:null,...(kind==='labor'?{admin:false}:{})});else followDraft[kind].splice(index,1);renderFollowEditor()}catch(e){$('dailyError').textContent=e.message}}
function followRowsEditor(kind){return followDraft[kind].map((r,i)=>{const input=(field,label,type='text',extra='')=>`<label>${label}<input id="fr-${kind}-${field}-${i}" type="${type}" ${extra} value="${esc(r[field]??'')}"></label>`;return `<div class="follow-row-editor">${input('name',kind==='labor'?'Empresa / oficio':kind==='machines'?'Máquina / equipo':'Incidencia','text','required maxlength="160"')}${kind==='incidents'?`<div class="form-pair"><label>Tipo<select id="fr-${kind}-severity-${i}">${fieldOptions(FOLLOW_SEVERITY,r.severity)}</select></label><label>Estado<select id="fr-${kind}-state-${i}">${fieldOptions({open:'Abierta',resolved:'Resuelta'},r.state)}</select></label></div>`:`<div class="follow-row-grid">${input('quantity',kind==='labor'?'Operarios':'Unidades','number','required min="1" max="500" step="1"')}<label>Unidad<select id="fr-${kind}-unit-${i}" onchange="updateFollowDuration('${kind}',${i})">${fieldOptions(kind==='labor'?FOLLOW_UNITS:{hour:'Hora',day:'Día'},r.unit)}</select></label>${input('duration',r.unit==='hour'?(kind==='labor'?'Horas / operario':'Horas / unidad'):(kind==='labor'?'Jornales / operario':'Días / unidad'),'number',`required min="0.01" max="${r.unit==='hour'?24:1}" step="0.01"`)}${input('rate','Precio € / '+(r.unit==='hour'?'hora':kind==='labor'?'jornal':'día'),'number','min="0" max="1000000" step="0.01" placeholder="Opcional"')}</div>${kind==='labor'?`<label class="follow-check"><input id="fr-${kind}-admin-${i}" type="checkbox" ${r.admin?'checked':''}>Trabajo por administración</label>`:''}<p class="small">Importe: ${r.rate===null||r.rate===''||r.rate===undefined?'Sin precio':followMoney(Number(r.quantity)*Number(r.duration)*Number(r.rate))}</p>`}<button class="light" type="button" onclick="changeFollowRows('${kind}',${i})">Quitar fila</button></div>`}).join('')||'<p class="small">Sin registros.</p>'}
function updateFollowDuration(kind,i){const unit=$('fr-'+kind+'-unit-'+i).value,field=$('fr-'+kind+'-duration-'+i);field.max=unit==='hour'?'24':'1';const labels={hour:kind==='labor'?'Horas / operario':'Horas / unidad',day:kind==='labor'?'Jornales / operario':'Días / unidad'};field.parentElement.firstChild.textContent=labels[unit];const rate=$('fr-'+kind+'-rate-'+i);rate.parentElement.firstChild.textContent='Precio € / '+(unit==='hour'?'hora':kind==='labor'?'jornal':'día')}
function editDailyReport(id=null,workId=null){if(followBusy)return;const saved=DAILY_REPORTS.find(r=>r.id===id);followDraft=saved?structuredClone(saved):{id:crypto.randomUUID(),work_id:workId||followWork||'',report_date:planningToday(),labor:[],machines:[],incidents:[],progress_pct:null,progress_note:'',notes:''};renderFollowEditor()}
function renderFollowEditor(){const d=followDraft,saved=DAILY_REPORTS.some(r=>r.id===d.id),works=NATIVE_WORKS.filter(w=>(!w.archived_at&&w.execution_state==='execution')||w.id===d.work_id);dialogForm(`<form id="dailyForm"><div class="top"><h2>${saved?'Editar parte diario':'Nuevo parte diario'}</h2><button id="closeTask" type="button" class="light">✕</button></div><div class="form-pair"><label>Obra<select id="dailyWork" required ${saved?'disabled':''}><option value="">Elige obra</option>${works.map(w=>`<option value="${w.id}" ${w.id===d.work_id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label><label>Fecha<input id="dailyDate" type="date" required max="${planningToday()}" value="${esc(d.report_date)}" ${saved?'readonly':''}></label></div><p class="small">Un parte por obra y día. Precios opcionales, sin IVA. Horas y jornales por cada operario o unidad; máximo 1 jornal/día por fila. No repitas los mismos operarios en varias filas.</p><section class="task-form-section"><h3>Operarios y administración</h3>${followRowsEditor('labor')}<button type="button" class="light" onclick="changeFollowRows('labor')">+ Cuadrilla / oficio</button></section><section class="task-form-section"><h3>Máquinas y equipos</h3>${followRowsEditor('machines')}<button type="button" class="light" onclick="changeFollowRows('machines')">+ Máquina</button></section><section class="task-form-section"><h3>Avance y trabajos</h3><label>Avance físico medido acumulado % · opcional<input id="dailyProgress" type="number" min="0" max="100" step="0.01" value="${d.progress_pct??''}"></label><label>Trabajos ejecutados, mediciones y unidades<textarea id="dailyProgressNote" maxlength="10000" placeholder="Ej.: superficie ejecutada, volumen vertido, metros de corte…">${esc(d.progress_note)}</textarea></label><p class="small">Registra solo mediciones verificadas. El porcentaje es acumulado de la obra, no el avance del día. Este parte no modifica las mediciones por fase del Gantt.</p></section><section class="task-form-section"><h3>Incidencias</h3>${followRowsEditor('incidents')}<button type="button" class="light" onclick="changeFollowRows('incidents')">+ Incidencia</button></section><label>Observaciones generales<textarea id="dailyNotes" maxlength="10000">${esc(d.notes)}</textarea></label><div id="dailyPreview" class="follow-preview"></div><button type="button" class="light" id="dailyCalculate">Recalcular importes</button><div id="dailyError" class="status err" role="status"></div><div class="form-actions"><button id="dailySave" class="dark">Guardar parte</button>${saved?'<button type="button" class="light" id="dailyDelete">Eliminar parte</button>':''}</div></form>`);
 $('dailyForm').onsubmit=saveDailyReport;$('dailyCalculate').onclick=()=>{try{collectFollowDraft();renderFollowPreview()}catch(e){$('dailyError').textContent=e.message}};if(saved)$('dailyDelete').onclick=deleteDailyReport;renderFollowPreview();
}
function renderFollowPreview(){const t=followTotals([followDraft]);$('dailyPreview').innerHTML=`<b>Importe valorado: ${followMoney(t.valued)}</b><small>Mano de obra ${followMoney(t.labor.valued)} · Máquinas ${followMoney(t.machines.valued)}<br>MO por administración: ${followMoney(t.admin.valued)}${t.unpriced?'<br>Valoración parcial: '+t.unpriced+' partidas sin precio.':''}</small>`}
async function saveDailyReport(e){e.preventDefault();if(followBusy)return;try{collectFollowDraft();const d=followDraft;if(!d.work_id||!d.report_date)throw Error('Elige obra y fecha.');if(d.report_date>planningToday())throw Error('El parte debe corresponder a hoy o a un día anterior.');const existing=DAILY_REPORTS.find(r=>r.work_id===d.work_id&&r.report_date===d.report_date&&r.id!==d.id);if(existing)throw Error('Ya existe un parte para esa obra y día. Abre el parte existente.');const old=DAILY_REPORTS.find(r=>r.id===d.id),payload={id:d.id,work_id:d.work_id,report_date:d.report_date,labor:d.labor,machines:d.machines,incidents:d.incidents,progress_pct:d.progress_pct,progress_note:d.progress_note,notes:d.notes};followBusy=true;$('dailySave').disabled=true;if($('dailyDelete'))$('dailyDelete').disabled=true;const rows=await eliteRequest('/rest/v1/elite_daily_reports'+(old?'?id=eq.'+d.id+'&updated_at=eq.'+encodeURIComponent(old.updated_at):''),{method:old?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});if(rows?.length!==1||rows[0].id!==d.id)throw Error('El parte cambió en otro dispositivo. Cierra y vuelve a cargar Seguimiento.');closeTaskDialog();await openFollowup();statusMessage('Parte diario guardado.')}catch(err){if($('dailyError'))$('dailyError').textContent=err.message;else statusMessage(err.message,true)}finally{followBusy=false;if($('dailySave'))$('dailySave').disabled=false;if($('dailyDelete'))$('dailyDelete').disabled=false}}
async function deleteDailyReport(){if(followBusy)return;const d=DAILY_REPORTS.find(r=>r.id===followDraft.id);if(!d)return;followBusy=true;$('dailySave').disabled=true;$('dailyDelete').disabled=true;try{const rows=await eliteRequest('/rest/v1/elite_daily_reports?id=eq.'+d.id+'&updated_at=eq.'+encodeURIComponent(d.updated_at),{method:'DELETE',headers:{Prefer:'return=representation'}});if(rows?.length!==1)throw Error('El parte cambió. Vuelve a cargar Seguimiento.');closeTaskDialog();await openFollowup();statusMessage('Parte eliminado.')}catch(e){if($('dailyError'))$('dailyError').textContent=e.message;else statusMessage(e.message,true)}finally{followBusy=false;if($('dailySave'))$('dailySave').disabled=false;if($('dailyDelete'))$('dailyDelete').disabled=false}}

$('enter').onclick=login;$('logout').onclick=logoutElite;$('newOwn').onclick=()=>openTaskForm();document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode==='tasks'){taskFilter='dated';taskQuery='';taskPriority='all';taskState='all';taskWork='all';taskSource='all'}if(location.hash==='#ia')history.replaceState(null,'',location.pathname+location.search);render()});if(session?.access_token){show();load()}
</script></body></html>
