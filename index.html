const BASE='https://vyswxgbbqyffnduhhrvz.supabase.co',KEY='sb_publishable_nzhp4ZiQ5NltXfmuoBc-hg_v_OVHRYb',FN=BASE+'/functions/v1/trello-obras';const $=id=>document.getElementById(id);let session=JSON.parse(localStorage.getItem('elite_session')||'null'),DATA=[],mode='tasks',calMode='month',calCursor=new Date(),taskFilter='dated',taskQuery='';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const fd=x=>x?new Date(x).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
function isChecklistCard(c){return !cardDue(c) && (/^\s*\d+\s*\.\s+/.test(c.name||'') || /^\s*\d{2}\s*·\s+/.test(c.name||''))}
function mainCards(b){return (b.cards||[]).filter(c=>!c.closed&&!isChecklistCard(c))}
function checklistCards(b){return (b.cards||[]).filter(c=>!c.closed&&isChecklistCard(c))}
function allCards(){return DATA.flatMap(b=>(b.cards||[]).map(c=>({...c,board:b}))).filter(c=>!c.closed&&!isChecklistCard(c))}function pending(){return allCards().filter(c=>!c.dueComplete&&!c.complete)}function progress(b){let c=mainCards(b);return c.length?Math.round(c.filter(x=>x.dueComplete||x.complete).length*100/c.length):0}function cardDue(c){let v=c.due?.date||c.due||c.dueDate||c.due_date||c.fechaVencimiento||null;return typeof v==='string'||typeof v==='number'?v:null}function cardStart(c){return c.start||c.startedAt||null}
async function login(){try{let r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.message);session=d;localStorage.setItem('elite_session',JSON.stringify(d));show();load()}catch(e){$('loginStatus').textContent='Error: '+e.message}}
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function load(){$('sync').textContent='Actualizando…';try{let r=await fetch(FN,{headers:{Authorization:'Bearer '+session.access_token,apikey:KEY}}),d=await r.json();if(!r.ok)throw Error(d.error||'Error '+r.status);DATA=Array.isArray(d)?d:(d.boards||[]);let cards=DATA.flatMap(b=>b.cards||[]),missing=cards.filter(c=>c.name?.trim().toLowerCase()==='hols'&&!cardDue(c));$('sync').textContent=missing.length?'Trello sincronizado, pero la integración no devuelve el vencimiento de Hols. Revisar la función trello-obras.':'Actualizado desde Trello';$('sync').className=missing.length?'status err':'status ok';render()}catch(e){$('sync').textContent='Error al leer Trello: '+e.message;$('sync').className='status err'}}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));if(mode==='works')works();else if(mode==='tasks')tasks();else calendar()}
function workDate(id,kind){return localStorage.getItem('elite_work_'+kind+'_'+id)||''}
function saveWorkDate(id,kind,value){if(value)localStorage.setItem('elite_work_'+kind+'_'+id,value);else localStorage.removeItem('elite_work_'+kind+'_'+id);works()}
function workDateLabel(value){if(!value)return '—';let a=value.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:'—'}
function works(){$('title').textContent='Obras';$('content').innerHTML='<div class="grid">'+DATA.map((b,i)=>{let cs=mainCards(b),pd=cs.filter(c=>!c.dueComplete&&!c.complete).length,st=cs.map(cardStart).filter(Boolean).sort(),du=cs.map(cardDue).filter(Boolean).sort(),p=localStorage.getItem('progress_'+b.id)??progress(b);return `<div class="work" onclick="detail(${i})"><h3>${esc(b.name)}</h3><div class="small">Inicio: ${workDateLabel(workDate(b.id,'start'))}<br>Fin: ${workDateLabel(workDate(b.id,'end'))}<br>Pendientes: <b>${pd}</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="small">${p}% avance</div></div>`}).join('')+'</div>'}

function taskDone(c){return Boolean(c.complete||c.dueComplete)}
function validTaskDate(c){const v=cardDue(c);return v&&!Number.isNaN(new Date(v).getTime())?new Date(v):null}
function taskDayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function taskUrgency(c){const d=validTaskDate(c);if(!d||taskDone(c))return '';const day=taskDayKey(d),today=taskDayKey(new Date());return day<today?'overdue':day===today?'today':''}
function compactTask(c,b,showBoard=true){const d=validTaskDate(c),label=d?fd(d):'Sin fecha',time=d?d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'';return `<a class="compact-task ${taskUrgency(c)}" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" title="${esc(c.name+' · '+b.name+' · '+label+(time?' '+time:''))}"><span class="task-copy"><span class="task-name">${taskDone(c)?'✓ ':''}${esc(c.name)}</span>${showBoard?`<span class="task-board">${esc(b.name)}</span>`:''}</span><span class="task-date">${label}${time?`<small>${time}</small>`:''}</span></a>`}
function groupedTaskList(cards){return DATA.map(b=>{const own=cards.filter(c=>c.board.id===b.id);if(!own.length)return '';const stages=new Map();own.forEach(c=>{const key=c.idList||'';if(!stages.has(key))stages.set(key,[]);stages.get(key).push(c)});return `<details class="task-group"><summary>${esc(b.name)}<span class="count">${own.length}</span></summary>${Array.from(stages,([id,cs])=>{const name=(b.lists||[]).find(l=>l.id===id)?.name||'Tareas';return `<details class="stage-group"${cs.length<=4?' open':''}><summary>${esc(name)} · ${cs.length}</summary>${cs.map(c=>compactTask(c,b,false)).join('')}</details>`}).join('')}</details>`}).join('')}
function datedTaskList(cards){const groups=new Map();cards.slice().sort((a,b)=>validTaskDate(a)-validTaskDate(b)||a.name.localeCompare(b.name,'es')).forEach(c=>{const key=taskDayKey(validTaskDate(c));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(c)});const today=taskDayKey(new Date());return Array.from(groups,([day,cs])=>{const d=validTaskDate(cs[0]),state=day<today?'overdue':day===today?'today':'',prefix=day<today?'Vencidas · ':day===today?'Hoy · ':'';return `<h3 class="agenda-heading ${state}"><span>${prefix}${esc(d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',year:'numeric'}))}</span><span>${cs.length}</span></h3><div class="task-list">${cs.map(c=>compactTask(c,c.board)).join('')}</div>`}).join('')}
function renderTaskResults(){const q=taskQuery.trim().toLocaleLowerCase('es');const all=DATA.flatMap(b=>(b.cards||[]).filter(c=>!c.closed).map(c=>({...c,board:b})));const cards=all.filter(c=>{const done=taskDone(c),dated=!!validTaskDate(c);return (taskFilter==='done'?done:!done&&(taskFilter==='dated'?dated:taskFilter==='undated'?!dated:true))&&(!q||(c.name+' '+c.board.name).toLocaleLowerCase('es').includes(q))});const dated=cards.filter(c=>validTaskDate(c)),undated=cards.filter(c=>!validTaskDate(c));let html=`<div class="task-summary">${cards.length} tarea${cards.length===1?'':'s'}${q?' encontradas':''} · Pulsa una tarea para abrirla en Trello</div>`;if(!cards.length)html+='<div class="task-list empty-tasks">No hay tareas en esta vista.</div>';else if(taskFilter==='undated'||taskFilter==='done')html+=groupedTaskList(cards);else {html+=datedTaskList(dated);if(undated.length)html+=`<h3 class="agenda-heading"><span>Sin fecha · por obra y etapa</span><span>${undated.length}</span></h3>`+groupedTaskList(undated)}$('taskResults').innerHTML=html}
function tasks(filter=taskFilter){taskFilter=filter;$('title').textContent=filter==='dated'?'Tareas con fecha':'Tareas';const tabs=[['dated','Con fecha'],['pending','Pendientes'],['undated','Sin fecha'],['done','Finalizadas']];$('content').innerHTML='<div class="task-toolbar" role="group" aria-label="Filtrar tareas">'+tabs.map(([id,label])=>`<button class="${filter===id?'dark':'light'}" aria-pressed="${filter===id}" onclick="tasks('${id}')">${label}</button>`).join('')+'</div><input class="task-search" id="taskSearch" type="search" aria-label="Buscar tarea u obra" placeholder="Buscar tarea u obra…" value="'+esc(taskQuery)+'"><div id="taskResults"></div>';$('taskSearch').oninput=e=>{taskQuery=e.target.value;renderTaskResults()};renderTaskResults()}

function calNav(n){if(calMode==='month')calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);else calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth(),calCursor.getDate()+7*n);calendar()}function setCal(v){calMode=v;calendar()}

function holidayFor(date){const k=date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");return FESTIVOS_VALENCIA[k]||null}
function holidayTag(h){return h?`<span class="holiday-label" title="${esc(h.scope)}">${esc(h.name)} · ${esc(h.scope)}</span>`:""}
function workMilestones(date){const key=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');return DATA.flatMap(b=>[['start','Inicio'],['end','Fin']].filter(([kind])=>workDate(b.id,kind)===key).map(([kind,label])=>({name:b.name,label}))) }
function milestoneTags(date,weekly=false){return workMilestones(date).map(m=>`<div class="milestone ${weekly?'weekly':''}" title="${esc(m.label+' de obra: '+m.name)}">${esc(m.label+' de obra: '+m.name)}</div>`).join('')}
function calendar(){$('title').textContent='Calendario';let cs=pending().filter(c=>cardDue(c));let controls=`<div class="panel"><div class="top"><div class="switch"><button class="${calMode==='month'?'dark':'light'}" onclick="setCal('month')">Mes</button><button class="${calMode==='week'?'dark':'light'}" onclick="setCal('week')">Semana</button></div><div class="switch"><button class="light" onclick="calNav(-1)">‹</button><button class="light" onclick="calCursor=new Date();calendar()">Ir a hoy</button><button class="light" onclick="calNav(1)">›</button></div></div></div>`;$('content').innerHTML=controls+(calMode==='month'?monthView(cs):weekView(cs))}
function monthView(cs){let y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),map={};cs.forEach(c=>{let d=new Date(cardDue(c));if(d.getFullYear()===y&&d.getMonth()===m)(map[d.getDate()]??=[]).push(c)});let h=`<div class="panel"><h3>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h3><div class="calhead">${['L','M','X','J','V','S','D'].map(x=>'<b>'+x+'</b>').join('')}</div><div class="month">`;let off=(first.getDay()+6)%7;for(let i=0;i<off;i++)h+='<div></div>';let now=new Date();for(let d=1;d<=last.getDate();d++){let today=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===d,hol=holidayFor(new Date(y,m,d));h+=`<div class="day ${today?'today':''} ${hol?'holiday':''}"><b>${d}</b>${holidayTag(hol)}${milestoneTags(new Date(y,m,d))}${(map[d]||[]).map(c=>`<span class="event" title="${esc(c.name)}">${esc(c.name)}</span>`).join('')}</div>`}return h+'</div></div>'}
function weekView(cs){let d=new Date(calCursor),day=(d.getDay()+6)%7,start=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);let days=Array.from({length:7},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));let h=`<div class="panel"><h3>${fd(days[0])} — ${fd(days[6])}</h3><div class="week">`;for(const x of days){let hol=holidayFor(x);let ev=cs.filter(c=>{let q=new Date(cardDue(c));return q.toDateString()===x.toDateString()});h+=`<div class="wday ${hol?'holiday':''}"><h3>${x.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}${x.toDateString()===new Date().toDateString()?' · Hoy':''}</h3>${holidayTag(hol)}${milestoneTags(x,true)}${ev.map(c=>`<a class="wevent" href="${esc(c.url)}" target="_blank"><b>${esc(c.name)}</b><div class="small">${esc(c.board.name)} · ${new Date(cardDue(c)).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div></a>`).join('')||'<span class="small">Sin tareas</span>'}</div>`}return h+'</div></div>'}
function detail(i){let b=DATA[i],cs=mainCards(b),check=checklistCards(b),p=localStorage.getItem('progress_'+b.id)??progress(b);$('title').textContent=b.name;$('content').innerHTML=`<div class="panel"><button class="light back" onclick="works()">← Obras</button><h2>${esc(b.name)}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0"><label style="font-size:13px;font-weight:700">Inicio de obra<input aria-label="Fecha inicio de obra" type="date" value="${workDate(b.id,'start')}" onchange="saveWorkDate('${b.id}','start',this.value);detail(${i})" style="width:100%;padding:9px;margin-top:5px;border:1px solid #ccd4dd;border-radius:9px"></label><label style="font-size:13px;font-weight:700">Fin de obra<input aria-label="Fecha fin de obra" type="date" value="${workDate(b.id,'end')}" onchange="saveWorkDate('${b.id}','end',this.value);detail(${i})" style="width:100%;padding:9px;margin-top:5px;border:1px solid #ccd4dd;border-radius:9px"></label></div><p class="small">Las fechas se guardan en este dispositivo, no en Trello.</p><b>Avance: <span id="pv">${p}</span>%</b><input class="range" type="range" min="0" max="100" value="${p}" oninput="document.getElementById('pv').textContent=this.value;localStorage.setItem('progress_${b.id}',this.value)"><details style="margin:16px 0;border:1px solid #dce2e9;border-radius:12px;padding:12px"><summary style="font-weight:750;cursor:pointer">☑ Checklist (${check.length})</summary><div style="padding-top:10px">${check.map(c=>`<a class="task" href="${esc(c.url)}" target="_blank"><span>☐ ${esc(c.name)}</span></a>`).join('')||'<p class="small">Sin elementos de checklist.</p>'}</div></details><h3>Tareas</h3>${cs.map(c=>`<a class="task" href="${esc(c.url)}" target="_blank"><b>${esc(c.name)}</b><span class="due">${fd(cardDue(c))}</span></a>`).join('')}</div>`}
$('enter').onclick=login;$('refresh').onclick=load;$('logout').onclick=()=>{localStorage.removeItem('elite_session');location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});if(session?.access_token){show();load()}
</script></body></html>
