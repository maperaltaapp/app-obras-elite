function isChecklistCard(c){return !cardDue(c) && (/^\s*\d+\s*\.\s+/.test(c.name||'') || /^\s*\d{2}\s*·\s+/.test(c.name||''))}

function checklistCards(b){return (b.cards||[]).filter(c=>!c.closed&&isChecklistCard(c))}

function workDate(id,kind){return localStorage.getItem('elite_work_'+kind+'_'+id)||''}

function taskDone(c){return Boolean(c.complete||c.dueComplete)}
function validTaskDate(c){const v=cardDue(c);return v&&!Number.isNaN(new Date(v).getTime())?new Date(v):null}
function taskDayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function taskUrgency(c){const d=validTaskDate(c);if(!d||taskDone(c))return '';const day=taskDayKey(d),today=taskDayKey(new Date());return day<today?'overdue':day===today?'today':''}
function compactTask(c,b,showBoard=true){const d=validTaskDate(c),label=d?fd(d):'Sin fecha',time=d?d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'',context=b.name+(c.work_name?' · '+c.work_name:'');const content=`<span class="task-copy"><span class="task-name">${taskDone(c)?'✓ ':''}${esc(shortTaskName(c.name))}</span>${showBoard?`<span class="task-board">${esc(context)}</span>`:''}</span><span class="task-date">${label}${time?`<small>${time}</small>`:''}</span>`;const title=esc(c.name+' · '+context+' · '+label+(time?' '+time:''));return c.own?`<button class="compact-task own-task ${taskUrgency(c)} ${taskTone(c)}" onclick="openTaskForm('${c.id}')" title="${title}" aria-label="${title}">${content}</button>`:`<a class="compact-task ${taskUrgency(c)} ${taskTone(c)}" href="${esc(trelloHref(c))}" target="_blank" rel="noopener noreferrer" title="${title}" aria-label="${title}">${content}</a>`}
function groupedTaskList(cards){return taskBoards().map(b=>{const own=cards.filter(c=>c.board.id===b.id);if(!own.length)return '';const stages=new Map();own.forEach(c=>{const key=c.idList||'';if(!stages.has(key))stages.set(key,[]);stages.get(key).push(c)});return `<details class="task-group"><summary>${esc(b.name)}<span class="count">${own.length}</span></summary>${Array.from(stages,([id,cs])=>{const name=(b.lists||[]).find(l=>l.id===id)?.name||'Tareas';return `<details class="stage-group"${cs.length<=4?' open':''}><summary>${esc(name)} · ${cs.length}</summary>${cs.map(c=>compactTask(c,b,false)).join('')}</details>`}).join('')}</details>`}).join('')}

function monthView(cs){const y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),map={};cs.slice().sort((a,b)=>validTaskDate(a)-validTaskDate(b)).forEach(c=>{const d=validTaskDate(c);if(d&&d.getFullYear()===y&&d.getMonth()===m)(map[d.getDate()]??=[]).push(c)});let html=`<div class="panel calendar-panel"><div class="calendar-caption"><h3>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h3><span>${cs.filter(c=>{const d=validTaskDate(c);return d&&d.getMonth()===m&&d.getFullYear()===y}).length} tareas</span></div><div class="calhead">${['L','M','X','J','V','S','D'].map(x=>'<b>'+x+'</b>').join('')}</div><div class="month">`;const offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++)html+='<div class="empty-day" aria-hidden="true"></div>';const now=taskDayKey(new Date());for(let day=1;day<=last.getDate();day++){const d=new Date(y,m,day),hol=holidayFor(d),today=taskDayKey(d)===now,events=map[day]||[],milestones=workMilestones(d);html+=`<div class="day ${today?'today':''} ${hol?'holiday':''}"><div class="day-number"><b>${day}</b>${hol?`<span class="holiday-dot" title="${esc(hol.name)}" aria-label="${esc(hol.name)}">•</span>`:''}</div>${events.slice(0,2).map(calendarTask).join('')}${calendarOverflow(events,2,true)}${milestones.length?`<details class="milestone-more"><summary>${milestones.length} hito${milestones.length>1?'s':''}</summary><div class="day-menu">${milestoneTags(d)}</div></details>`:''}</div>`}return html+'</div><div class="calendar-key"><span><i class="key-dot teal"></i>Trello</span><span><i class="key-dot purple"></i>Personal</span><span><i class="key-dot amber"></i>Trabajo</span><span><i class="key-dot red"></i>Festivo / hito</span></div></div>'}

async function enablePush(){if(!pushSupport())return;try{const permission=await Notification.requestPermission();if(permission!=='granted'){pushMessage('No se ha concedido permiso para avisos.',true);return}$('enablePush').disabled=true;pushMessage('Activando…');const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;const config=await eliteRequest('/functions/v1/elite-notifications');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidBytes(config.publicKey)});await eliteRequest('/functions/v1/elite-notifications',{method:'POST',body:JSON.stringify({action:'subscribe',subscription:sub.toJSON()})});await refreshPushStatus()}catch(e){pushMessage(e.message,true)}finally{if($('enablePush'))$('enablePush').disabled=false}}
async function testPush(){try{$('testPush').disabled=true;const sub=await currentSubscription();if(!sub)throw Error('Activa los avisos primero');await eliteRequest('/functions/v1/elite-notifications',{method:'POST',body:JSON.stringify({action:'test',endpoint:sub.endpoint})});pushMessage('Aviso de prueba enviado. Comprueba las notificaciones de este dispositivo.')}catch(e){pushMessage(e.message,true)}finally{if($('testPush'))$('testPush').disabled=false}}
async function unsubscribeOwn(){if(!pushSupport())return;const sub=await currentSubscription();if(sub){await eliteRequest('/rest/v1/elite_push_subscriptions?endpoint=eq.'+encodeURIComponent(sub.endpoint),{method:'DELETE'});await sub.unsubscribe()}}
async function disablePush(){try{await unsubscribeOwn();await refreshPushStatus()}catch(e){pushMessage(e.message,true)}}
async function logoutElite(){try{await unsubscribeOwn();localStorage.removeItem('elite_session');location.reload()}catch(e){$('sync').textContent='No se pudo desactivar los avisos al salir: '+e.message;$('sync').className='status err'}}

$('enter').onclick=login;$('refresh').onclick=load;$('logout').onclick=logoutElite;$('newOwn').onclick=()=>openTaskForm();$('pushSettings').onclick=showNotificationSettings;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});if(session?.access_token){show();load()}
</script></body></html>
