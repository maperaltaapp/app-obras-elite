<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>App Obras Elite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px} header h1{margin:0;font-size:22px} header small{color:#cbd5e1}
main{max-width:900px;margin:auto;padding:16px} .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}
input,button{width:100%;padding:12px;border-radius:9px;font-size:16px;margin-top:9px} input{border:1px solid #cbd5e1}
button{border:0;background:#111827;color:white;font-weight:700} button.secondary{background:#e5e7eb;color:#111827}
.hidden{display:none} .status{margin-top:10px;font-size:14px} .error{color:#b91c1c} .ok{color:#047857}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px} nav button{min-width:110px;margin:0}
.item{border-top:1px solid #e5e7eb;padding:12px 0} pre{white-space:pre-wrap;word-break:break-word;font-size:12px}
</style>
</head>
<body>
<header><h1>App Obras Elite</h1><small>Trello · Supabase · Gestión de obras</small></header>
<main>
<section id="login" class="card">
<h2>Acceso</h2>
<p>Entra con el usuario creado en Supabase.</p>
<input id="email" type="email" autocomplete="email" placeholder="Correo electrónico">
<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
<button id="loginBtn">Entrar</button>
<div id="loginStatus" class="status"></div>
</section>

<section id="app" class="hidden">
<div class="card">
<div id="user"></div>
<button id="refreshBtn">Actualizar desde Trello</button>
<button id="logoutBtn" class="secondary">Cerrar sesión</button>
<div id="syncStatus" class="status"></div>
</div>
<nav>
<button data-tab="obras">Obras</button>
<button data-tab="tareas">Tareas</button>
<button data-tab="agenda">Agenda</button>
</nav>
<section class="card">
<h2 id="sectionTitle">Obras</h2>
<div id="content">Pulsa “Actualizar desde Trello”.</div>
</section>
</section>
</main>
<script>
const SUPABASE_URL = 'https://vyswxgbbqyffnduhrvz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nzhp4ZiQ5NltXfmuoBc-hg_v_OVHRYb';
const FUNCTION_URL = 'https://vyswxgbbqyffnduhrvz.supabase.co/functions/v1/trello-obras';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let dataCache = null;
let activeTab = "obras";

const el = id => document.getElementById(id);
function message(node,text,ok=false){node.textContent=text;node.className="status "+(ok?"ok":"error");}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

async function showSession(){
 const {data:{session}}=await sb.auth.getSession();
 el("login").classList.toggle("hidden",!!session);
 el("app").classList.toggle("hidden",!session);
 if(session){el("user").textContent="Sesión: "+session.user.email; await loadTrello();}
}

el("loginBtn").onclick=async()=>{
 message(el("loginStatus"),"Conectando…",true);
 const {error}=await sb.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});
 if(error) return message(el("loginStatus"),error.message);
 el("password").value=""; await showSession();
};
el("logoutBtn").onclick=async()=>{await sb.auth.signOut(); dataCache=null; await showSession();};
el("refreshBtn").onclick=loadTrello;

async function loadTrello(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session) return;
 message(el("syncStatus"),"Actualizando desde Trello…",true);
 try{
   const r=await fetch(FUNCTION_URL,{headers:{Authorization:"Bearer "+session.access_token}});
   const text=await r.text();
   if(!r.ok) throw new Error("HTTP "+r.status+": "+text);
   dataCache=JSON.parse(text); render();
   message(el("syncStatus"),"Datos actualizados desde Trello.",true);
 }catch(e){
   message(el("syncStatus"),"La sesión funciona, pero trello-obras aún necesita aceptar la autenticación y CORS: "+e.message);
 }
}

function normalize(){
 if(Array.isArray(dataCache)) return dataCache;
 if(Array.isArray(dataCache?.obras)) return dataCache.obras;
 if(Array.isArray(dataCache?.boards)) return dataCache.boards;
 return [];
}
function render(){
 const items=normalize();
 el("sectionTitle").textContent=activeTab[0].toUpperCase()+activeTab.slice(1);
 if(!dataCache){el("content").textContent="Sin datos todavía.";return;}
 if(activeTab==="obras"){
   el("content").innerHTML=items.length?items.map(x=>`<div class="item"><strong>${escapeHtml(x.name||x.nombre||x.title||"Obra")}</strong></div>`).join(""):
   "<pre>"+escapeHtml(JSON.stringify(dataCache,null,2))+"</pre>";
 } else {
   el("content").innerHTML="<p>Esta sección se alimentará de los datos reales recibidos de Trello.</p><pre>"+escapeHtml(JSON.stringify(dataCache,null,2))+"</pre>";
 }
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render();});
sb.auth.onAuthStateChange(()=>showSession());
showSession();
</script>
</body>
</html>
