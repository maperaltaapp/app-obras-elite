<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Obras Elite</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px}main{max-width:850px;margin:auto;padding:16px}.card{background:white;padding:16px;border-radius:14px;margin-bottom:14px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:9px;border-radius:9px;font-size:16px}input{border:1px solid #bbb}button{border:0;background:#111827;color:white;font-weight:700}.secondary{background:#e5e7eb;color:#111827}.hidden{display:none}nav{display:flex;gap:8px}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><header><h2>App Obras Elite</h2><div>Trello · Supabase · Gestión de obras</div></header><main><section id="login" class="card"><h2>Acceso</h2><input id="email" type="email" placeholder="Correo electrónico"><input id="password" type="password" placeholder="Contraseña"><button id="enter">Entrar</button><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="card"><div id="user"></div><button id="refresh">Actualizar desde Trello</button><button id="logout" class="secondary">Cerrar sesión</button><p id="sync"></p></div><nav><button>Obras</button><button>Tareas</button><button>Agenda</button></nav><div class="card"><h2>Datos de Trello</h2><div id="content">Sin datos todavía.</div></div></section></main><script>
const URL="https://vyswxgbbqyffnduhrvz.supabase.co",KEY="sb_publishable_nzhp4ZiQ5NltXfmuoBc-hg_v_OVHRYb",FN=URL+"/functions/v1/trello-obras";const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
async function screen(){const{data:{session}}=await sb.auth.getSession();$("login").classList.toggle("hidden",!!session);$("app").classList.toggle("hidden",!session);if(session){$("user").textContent="Sesión: "+session.user.email;load();}}
$("enter").onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});$("loginMsg").textContent=error?error.message:"";if(!error)screen();};$("logout").onclick=async()=>{await sb.auth.signOut();screen();};$("refresh").onclick=load;
async function load(){const{data:{session}}=await sb.auth.getSession();if(!session)return;$("sync").textContent="Actualizando desde Trello…";try{const r=await fetch(FN,{headers:{Authorization:"Bearer "+session.access_token}});const t=await r.text();if(!r.ok)throw Error("HTTP "+r.status+": "+t);const d=JSON.parse(t);$("content").innerHTML="<pre>"+JSON.stringify(d,null,2).replace(/</g,"&lt;")+"</pre>";$("sync").textContent="Datos actualizados desde Trello.";}catch(e){$("sync").textContent="Inicio de sesión correcto. Falta adaptar trello-obras para CORS/autenticación: "+e.message;}}
sb.auth.onAuthStateChange(()=>screen());screen();</script></body></html>
